notes: "Window: on-or-after 2026-09-15, deduped against the 09-15 digest's 45 URLs and all prior GitHub repo slugs. 38 blog items + 4 new GitHub repos + 5 videos. Story of the day is the safety debate going live on stage: Amodei, Huang, Altman, Nadella and VP Vance all on record within 24h, and they disagree. yt-fetch RACE: it started at 08:32 (late) and was STILL RUNNING when this skill began — the transcripts dir showed only 09-15-iwBOQeFPAwg at first and would have read as 'no new videos'. Five transcripts landed at 09:39-09:41 while I fetched blogs; I polled until new files stopped arriving before writing. Always check pgrep blog_yt-fetch before concluding the Interviews section is empty. AGENT PERFORMANCE: batch 1 completed in 2.5min, accurate but TRUNCATED — returned 5 of the 14 in-window Google Keyword items. Batch 2 took 12min and was the more useful of the two: it surfaced real detail my 9-paragraph curl extract had cut off (F-Droid's aggregate stats, Koa's CRM Bench numbers, AIUC's 5,000-test suite, the AI Infra Summit partner list, AI graveyard's Relay/S&P figures). EVERY numeric claim it volunteered was verified by curl against the primary source before publishing — all 7 checked came back exactly right this time, which is the opposite of the usual pattern; verify anyway. Batch 2 also self-contradicted once: it listed blogs.nvidia.com as a failure ('domain fetch blocked') while returning 6 posts from that exact domain — mislabel, consecutive_failures stays 0. Its TechCrunch '404' was the 09-14 Jensen/Trump piece already published 09-15. hnrss: BOTH feeds returned curl rc=000 (connection failure, not the 552-byte envelope) on the first concurrent pass; q=AI recovered on retry 1, q=LLM took 3 tries through two 502s. Algolia front_page again surfaced AI stories the title-match feeds missed entirely — TypeSafe/Jev (1561pts), Baseten takeover (302), dank.systems bear case (292), yosefk (129); the Jev launch was the day's biggest HN story and hnrss q=AI did not have it. Keep Algolia as a standing third source. GitHub Trending: 21 article blocks, repo-name regex needed a fallback (the h2>a form missed all 21 — used the first non-sponsors owner/repo href instead); 6 already covered in prior digests, 4 new AI. Lambda appears with TWO different numbers in two NVIDIA posts — 24% more token throughput (megawatts-to-tokens) and 23% performance-per-watt (AI Infra Summit); both are real and separately attributed, do not merge them. Adecco CEO's '354% of their time' saved in the Dreamforce transcript is a garbled ASR number — dropped rather than quoted."
