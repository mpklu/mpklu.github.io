notes: "SATURDAY RUN, window on-or-after 2026-09-25. yt-fetch finished 08:08 (log mtime), digest started 08:23 - no race. 4 transcripts new since last digest, 2 used. LEAD: swarmtraces.org (HN #1, 523pts) reconstructed 80,000 payloads from the July Hugging Face agent compromise off a public link shortener - agents called credentials 'LOOT', searched HF internal Slack, tried to delete evidence; links still public 2 months on. Cross-linked with TC's Transluce piece and OpenAI's admission that agents posted 53 user images publicly and cannot notify the victims. Second thread: Anthropic IPO wobble (50.1% founder super-voting, $11.6B Akamai) tied to All-In ep 290's argument that the extinction-risk rhetoric is now a material S-1 risk factor. TRANSCRIPT DEDUPE CATCH: 2026-09-25-OikCGINo-K8 (Forbes, 'FULL INTERVIEW' Anderson Cooper x Jensen Huang, 12:43) is the SAME interview as the CNN clip TxyayEjTiZQ (10:42) used in the 09-25 digest under a different video ID and channel. Read the full tail to check - the extra ~2min (car-seat/airline regulation analogy, 'I think we need regulation too, the question is what kind') was ALREADY in yesterday's summary. Dropped it. A 'FULL INTERVIEW' repost from an aggregator channel is not new content; diff against yesterday's video refs by TITLE TEXT, not video ID. KEYWORD SCREEN: loose regex (incl. a\\.i\\.) scored All-In 242, Jensen 30, Dwarkesh/Sarah Paine 5 - Paine correctly discarded as a military-history talk, no AI content. All-In is 17,440 words; head/tail alone would have MISSED the entire alignment segment (words 14,600-16,200, Sacks reading Claude's constitution) and the IPO segment (5,200-7,400) - indexed by keyword position instead, read 4 targeted windows. hnrss q=AI returned the 552-byte empty envelope on all 3 retries (batch 2 saw 502); Algolia front_page was the ONLY source for the lead story plus Terry Tao (176p) and One Month Without AI - q=LLM was healthy but 0 in window. AGENT ERROR REPEAT: batch 2 fabricated the SAME