last_run_date: "2026-09-17"
last_summary_file: "content/newsdigests/2026-09-17-daily-digest.md"
notes: "Window: on-or-after 2026-09-16, deduped against the 09-16 digest's 45 URLs and all prior GitHub repo slugs. 31 blog items + 2 new GitHub repos + 3 videos. Story of the day is Zuckerberg breaking ranks on Amodei's coordinated-slowdown proposal (Rundown's scorecard: Amodei/Altman/Musk/Hassabis for, Zuck/Huang/Trump/Beijing against) landing the same day OpenAI published its misalignment reporting framework and TechCrunch ran TWO pieces questioning embedded evaluators. yt-fetch RACE AGAIN, worse than 09-16: it started at 08:46 and was still running when this skill began — at that moment the transcripts dir held ONLY files already published in the 09-16 digest, so the Interviews section would have read as empty. First new transcript landed 09:15, a SECOND at 09:19, and a THIRD at 09:19:20; the process did not exit until ~09:22. I polled with a bounded pgrep loop until it exited rather than guessing. The 09:19 arrival (USA TODAY Dreamforce cut) was the better of the two — do not stop polling after the first file appears. WORSE: I nearly missed the third file (2026-09-15-_JbDZ2Rj2SA, the CNN Amodei/Tristan Harris agent-swarm interview and the single most substantive video of the run) because I was spot-checking with `ls -la | tail -4` — the leading underscore in the video ID sorts it into the MIDDLE of the 09-15 block, not the end. It only surfaced in `git status` output after the commit. NEVER verify the transcript set with tail; diff the full filename list against the prior digest's youtube.com/watch URLs. AGENT PERFORMANCE: both batches completed (~29min and ~30min) and both were useful, but both mislabeled healthy sources as failures — batch 1 called Anthropic a 'fetch timeout' (my curl got 178KB fine, nothing in window), One Useful Thing 'content unavailable' (RSS healthy, 20 items, newest still 2026-08-31, now 17 days stale), and listed Cursor and Addy Osmani as failures when they were simply 0-in-window. consecutive_failures stays 0 for all four. Batch 2 mislabeled StackOverflow/Lobsters/hnrss-LLM the same way. VERIFICATION CAUGHT TWO ERRORS: batch 2 reported Vera Rubin '3.7x on demanding workloads like DeepSeek-R1 and Qwen3-VL' — the real post says 3.7x on Qwen3-VL and 2.5x on DeepSeek-R1, two different numbers conflated into one; and its GitHub Trending absolute star counts are garbage (affaan-m/ECC listed at 260,876 stars for a repo gaining 1,173/day, and the list is not actually sorted by the counts given) — used my own 'stars today' from the trending page instead and dropped absolute counts. Everything else batch 2 volunteered verified exactly: TensorRT Edge-LLM 52.33 tok/s + 1,007 turns + 6.4x, cuTile 24 operators + 99.5%, Treble $18M/Paladin/$40M total (the odd $12M+$18M>$40M math is TechCrunch's own), Hang Ten $53M/$32M/$85M/Xora + every named investor, Google Home $20/mo Premium Advanced. Batch 1's Rundown summary verified verbatim including the Zuck quotes. Batch 1's teens stats were RIGHT where checkable (1,000+ teens, 74% weekly study partner) but it omitted the strongest number (94% used AI in past year) and volunteered a '55% cross-check facts' figure I could NOT find on the page — dropped it, used the verified 64% digital-literacy figure instead. hnrss: both feeds healthy first try this run (16KB and 19KB, no retries needed) but q=AI had only 3 in-window items and q=LLM had ZERO — Algolia front_page + search_by_date(points>100) was again the dominant source, supplying CUDA Rust (776pts, the day's top story and absent from both hnrss feeds), qorl (595), ternary LLM (218), Dream-RSI (206), DeepSeek hacking (169), DeepMind Institute (175), OpenSpec (163), PS5 Linux (318). NOTE the Algolia search_by_date numericFilters must be passed with curl -G --data-urlencode or the API returns non-JSON. UNREADABLE (JS-only, no data endpoint): harnesstax.github.io (161pts) and mimo.xiaomi.com/rl (478pts) — both omitted rather than summarized from their titles; z.ai blog also returns a 2KB shell. OpenAI article pages still 403 (10KB Cloudflare interstitial) so the misalignment framework — a major safety item — is published from its one-line RSS description with that limitation stated in the digest body. GitHub Trending: 20 articles, repo-name regex needed the sponsors filter again (affaan-m and ever-co both resolved to /sponsors/ links first); 11 already covered in prior digests, only 2 genuinely new AI repos."
