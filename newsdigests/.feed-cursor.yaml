last_run_date: "2026-10-22"
last_summary_file: "content/newsdigests/2026-10-22-daily-digest.md"
notes: "THURSDAY RUN. last_run_date was 10-21 == yesterday, so the window was ON OR AFTER 2026-10-21 minus the 98 reference URLs of the 10-20 and 10-21 digests (exact-URL kills: OpenAI-on-Google-Cloud x3, Vera Rubin trucks, CNBC safety-monitoring, Trump dividend, NextDC, Guardian AI music, NVIDIA Agent Toolkit / open models / keynote live blog / confidential computing / Sentry / OpenShell RA, Register script-kiddies / OpenShell / trailer parks / Kaseya / Oxford, Anthropic attack-surface). 77 refs: 74 blog, 3 video. FOUR NEW TRANSCRIPTS, ALL USED: Altman/Berman, Huang/Yahoo Finance, Huang GTC keynote (yesterday's 429'd pending ID arrived as predicted), All-In Krishna/Arora. Body 6,758 words.
  RACE CHECK: pgrep showed PID 85866, a yt-dlp bestaudio download of A768vb_F88g, 16 HOURS elapsed, ppid 20035 — an orphan from YESTERDAY's run, not today's (today's yt-fetch log mtime 08:07, cursor last_run_date 10-22). Not a race. Escalate to the human: a hung yt-dlp process has been downloading audio to stdout for 16 hours.
  THE LEAD HAD TWELVE PRIMARIES AND SECONDARIES. PHP2Shell: OpenAI Patch the Planet (RSS), Wiz blog (HN 442p), Google Cloud security blog (own sweep), Calif (Rundown outbound link), PHP Foundation blog and Microsoft Security blog (FOUND ONLY BY HREF-GREPPING THE REGISTER ARTICLE HTML — Register pages carry outbound links to primaries; CNBC pages do not), Register x2, Guardian, Verge, TechCrunch, CNBC x2. My paragraph extractor drops hrefs; re-curl and grep href= on any secondary whose primary is unnamed.
  CLAUDE DUET WAS NOT ON anthropic.com/news. The announcement lives at claude.com/resources/articles/claude-duet and the product page at claude.com/product/claude-duet; anthropic.com/news carried only the LTBT Stubbs post. HN (436p) and CNBC surfaced it. ADD claude.com/resources/articles to the sweep. Also: anthropic.com/news was NOT in my own 29-feed sweep (only agent batch 1 covered it) — add it.
  DATE KILLS: Mistral Large 4 (mistral.ai datePublished 2026-10-06, HN 321p on 10-21 is a RESURFACE, not a launch; weights are due 'end of this month' so expect a real post), elonlit PyTorch backward-pass malware (JSON-LD 10-20, Lobsters pubDate 10-21), rumple LLM-confidence post (URL path 10-20), openai/openai-cli repo (created 2026-05-01, 935 stars), omnara (created 2025-07). Ampersand (humansand.ai) is UNDATED — included per the include-if-unparseable rule with 'undated (surfaced 2026-10-21)' in the reference; HN first saw it 10-21T02:35Z at 3 points.
  OPENAI 403 LEDGER: all 9 in-window openai.com/index pages returned 403 to BOTH haiku agents' curl+browser-UA, and 200 to my urllib with the same UA on 8 of 9; the biology post 403'd my first urllib call and returned 200 on the retry. The block is per-client and intermittent, not per-UA. Always retry from a second client before falling back to RSS descriptions. The openai.com <meta time> values are bogus (2026-06-22, 2026-08-17, 2026-07-08 on 10-21 posts) — take dates from the RSS pubDate only.
  AGENT DRIFT: batch 1 (haiku) returned RSS descriptions as 'content' for all 9 OpenAI items (acceptable, flagged honestly), found the Anthropic LTBT post my sweep could not, and was otherwise clean. Batch 2 was again the stronger half: it caught a Verge re-fetch returning a 'Verge.com is for sale' parking page and used the first copy, caught developer.nvidia.com feed <updated> disagreeing with article datePublished (3 old posts excluded), killed Mistral Large 4 on date, and correctly noted my prompt's Algolia timestamp 1792368000 is 2026-10-19T00:00Z not 10-21 (my own sweep computed its timestamp from the cutoff and was correct; the prompt constant was hand-typed and wrong — compute it, never paste it). Neither agent saw prompt injection. My own sweep was the sole source of: Google Cloud PHP response, Microsoft Security blog, PHP Foundation, Calif, BBC resignations (via Algolia), CNBC x9, Guardian x7, Register x11, Verge x5, Nieman x2, MIT TR (dropped: WD-sponsored storage piece), Phoronix Mesa, PyTorch x2, Ars (Tor — not AI, dropped). FOURTEENTH-PLUS RUN WHERE NEITHER SIDE WAS REDUNDANT.
  QUOTE VERIFIER (own script, split-on-quote-char, prefix diagnostic): 201/205 first pass. Misses: a bracketed edit inside a quote ('push[es]'), a self-coined phrase in quotes ('learned applications'), a dropped word ('maybe explains' vs 'maybe this explains'), and an ASR [music] tag inside a keynote quote ('asking it [music] nicely'). Then 2 misses from CAPITALISING the first letter of a mid-sentence quote — the verifier is case-sensitive and so is honesty; use a lowercase lead-in. 204/204 final.
  check_post: 0 errors; mean sentence 29.5 words after splitting ~25 sentences (was 35.2). The checker does NOT split on a period inside a closing quote (.\") so quote-dense paragraphs register as 80-126-word 'sentences'; the residual warnings are that artifact. hugo --minify exits 0; 77 body URLs map 1:1 onto 77 references in first-citation order; zero future-dated strings; 6 h2 / 59 h3. All four cited transcripts re-ls'd at commit time.
  EDIT TOOL not attempted; every revision was a Python in-place rewrite from Bash (asserting count==1 per replacement), which is cheaper than a full Write and worked without a permission prompt.
  SYNTHESES WORTH REPEATING: (1) PHP2Shell found-by-AI + Storm-0940/ARTEX agentic intrusion + LiteLLM gateway trojan + OpenAI's router/gateway approval rule, all on one day. (2) Four personal agents (Duet, Muse 10M, Dot per Altman, RTX Spark personal agents) vs Huang's zero-trust OpenShell answer and Arora's 'personal agent is the moat'. (3) Recursive Flint built by its Eureka Machine the same day Altman called RSI 'a very dangerous thing to push on'. (4) Open-weight economics from Krishna (10% cost / 90% quality), Huang (80% of AI-native startups), Forrester (half of tokens, 5% of spend) and Stacklok (lock-in moved to integrations). (5) Backlash on the ballot: 150+ midterm ads, UK 12-month window, Finland trees, Texas air, Barclays 5,000, DeepMind resignations. (6) Verge's antivenom correction to yesterday's Anthropic scorpion post.
  SOURCE-FILE DEBT, THIRTIETH RUN: `.feed/source.md` is still at one commit. Carried manually and absent from the file: claude.com/resources/articles (NEW, carried Duet), thephp.foundation/blog (NEW), microsoft.com/en-us/security/blog (NEW), calif.io (NEW), alignment.openai.com/misalignment-reports/, cloudblog.withgoogle.com/rss/, pytorch.org/blog/feed/, theguardian.com/technology/rss + /artificialintelligenceai/rss, CNBC tech+top RSS, theregister.com/headlines.atom, theverge.com/rss, technologyreview.com/feed, phoronix.com/rss.php, anthropic.com/news + /research, claude.dev/blog, arstechnica technology-lab, stackoverflow.blog/feed, oneusefulthing.org/feed, niemanlab.org/feed, jack-clark.net, newsroom.spotify.com/feed, linuxfoundation.org/press. Escalated in the run report."
