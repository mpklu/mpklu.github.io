last_run_date: "2026-09-21"
last_summary_file: "content/newsdigests/2026-09-21-daily-digest.md"
notes: "MONDAY RUN, one-day window (on-or-after 2026-09-20). No yt-fetch race: log mtime 08:06, this skill started 08:23, pgrep clean. BSD GREP -o UNDERCOUNTS ON LONG LINES - NEW AND IMPORTANT: transcripts are ~10 lines of very long paragraphs, and `grep -oiwE ... | wc -l` returned 7 keyword hits for the Theo transcript when the true count is 121 broad / 23 strict. yt-fetch's own report made the same mistake (it scored the two new transcripts 8 and 11 and called them 'thin on AI content'). Recounting in Python FLIPPED the call: the Theo 'Jev is incredible' video is a substantive 30-min AI model review and became this digest's Interviews section. Use python re.findall, never BSD grep -o, for transcript screening. The AppLovin All-In episode was correctly discarded (5 strict hits / 4882 words, ad-tech founder story). BATCH 1 WAS ACCURATE: its zero_in_window matched my independent parse exactly on all six feeds. But it wrongly labeled Anthropic and Cursor as FAILURES ('JS-rendered, no RSS') - both fetched fine for me (178KB and 412KB) and are healthy-but-quiet. ANTHROPIC FALSE-POSITIVE DATE: /engineering contains a 2026-09-18 timestamp that is a Sanity CMS siteSettings `_updatedAt` field, NOT a post date; newest actual post is still 2026-05-25. Don't let a bare date regex fool you. BATCH 2 UNDER-REPORTED AGAIN AND LIED ABOUT ITS OWN OUTPUT: its chat reply contained literal '[... 5 more posts ...]' and '[... 10 more repos ...]' placeholders; the real data was in /tmp/blog_fetch_batch2_final.yaml (which did exist). It returned only 4 HN items; my own Algolia run found ~20 AI-relevant stories in window. ALGOLIA REMAINS THE ONLY REAL HN PATH. Every TechCrunch 'content' field it returned was pure nav chrome ('Toggle Mega Menu'), so its 4 correct TechCrunch URLs came with zero usable content - a correct URL list still implies nothing about content. GITHUB TRENDING STAR COUNTS WERE OFF BY ONE POSITION in the agent's list (it reported agent-native=0 then shifted every subsequent repo's stars up one row). My first flat regex ALSO misaligned descriptions starting at repo 6, because anthropics/financial-services has NO description and the descs list skips it. FIX: split on '<article class=\"Box-row' and parse name/stars/desc per block - that is the only alignment-safe method. THREE DEDUPES CAUGHT, all of the story-text-not-URL kind: (1) Rundown's 09-21 lead 'OpenAI goes from hacker to hacked' is the SAME Hacktron intrusion the 09-19 digest already ran from the primary hacktron.ai blog - a newsletter repackaging a story we led with two days ago; (2) TechCrunch's feed re-dated 'World model companies are keeping a lot of secrets' to 09-20 with a NEW /2026/09/20/ URL, but the 09-19 digest already covered it at the /2026/09/18/ URL - same title, same author, different URL, so URL-grep alone says NEW; (3) chesterwisniewski Creative Commons and the LLMentalist Effect both resurfaced on HN in window but ran in the 09-20 digest. TWO GENUINELY DROPPED 09-18 STORIES RECOVERED via the Rundown's quick hits and verified independently: Anthropic's Bay Area wet lab (TechCrunch 09-18 + Reuters, Eric Kauderer-Abrams, Coefficient Bio $400M April acquisition) and the 100+ evaluator letter (AI Evaluator Forum, chair Conrad Stosz, Hinton/METR/Stanford/JHU signatories). Neither was in the 09-19 digest despite being in the TechCrunch feed - worth grepping the feed's older items for gaps, not just the window. CNBC 403s (used IBTimes instead). QWEN.AI/BLOG CONFIRMED STILL A JS SHELL - 92KB raw, 4 chars visible text ('Qwen'); sourced Qwen-Image-2.1 from TechNode press coverage with an explicit caveat, and caught that 'open-sources' is wrong: it ships under the non-commercial Qwen Research License. GUEST-POST ATTRIBUTION AGAIN: terrytao.wordpress.com 'Why do we need human mathematicians anymore?' is by Po-Shen Loh, not Tao - second month running that a Tao-blog guest post needed correct attribution. CROSS-SOURCE SYNTHESIS: the Dead Neurons 'selling garbage to Washington' essay reaches the opposite conclusion from the same Gemini/OpenAI-agent incidents this digest covered on 09-20, and the evaluator letter lands days after Anthropic picked Accenture - both pairings preserved in the text. JEV ECOSYSTEM is the emergent story: Kev, jevchat and Jev-Leftpad all hit the front page within 48h of the 09-15 launch, and the Theo video ties the section together."
