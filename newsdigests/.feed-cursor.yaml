ming Easier' (Lobsters 09-29) 403'd on both curl and WebFetch with a browser UA - OMITTED rather than summarized from the headline, same call as the NYT piece yesterday. Glyph 'What Would A Serious AI Product Look Like?' is dated 09-27 (out of the strict window) but was never in a prior digest and hit HN on the 28th - INCLUDED with the real date stated inline. hnrss STATUS CHANGE: both q=AI and q=LLM now return a genuine HTTP 502 at 150 bytes, not the 552-byte empty envelope - the feeds have degraded further, FOURTH consecutive dead day for q=AI. Algolia front_page + search_by_date was again the sole HN source. Batch 1 and my curl parse agreed source-for-source on every first-party feed (third exact double-confirmation in three days)."
