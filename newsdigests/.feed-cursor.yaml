notes: "SUNDAY RUN, window on-or-after 2026-09-26. yt-fetch finished 08:07-08:08 (log mtime), digest started 08:23 - no race. 2 new transcripts, BOTH used. QUIET FIRST-PARTY DAY: all 8 batch-1 sources (Anthropic, OpenAI, Google x4, BAIR, One Useful Thinking, Rundown, Cursor, Addy Osmani) were healthy with ZERO posts in window - my own curl parse and the agent agreed source-for-source, which is the first exact double-confirmation in a while. Every item in the digest came from TechCrunch (3), Hacker News (7), Lobsters (1), or the two videos. LEAD: Authors Guild v OpenAI unsealed briefs - Gogineni's 'acceptable economic disruption' / 'death of the reader', Jack Clark's 'will make people unemployed ... release anyway', and McCandlish's worry about 'optics' of LibGen 'showing up on [Hacker News]' (the HN title is literally that quote). Dario Amodei appears as OpenAI's then-Research Director calling LibGen 'a bit sketchier' - and separately as the author of the pacing essay Theo's video is about, which is a nice accidental thread. SECOND THREAD: OpenAI's DNS misalignment report continues yesterday's Hugging Face lead; tool-use training/eval/inference on top models STILL paused. HN DATE TRAP (new, important): Algolia's created_at is the SUBMISSION date, not the publication date, and three of today's best items were older articles newly surfaced - Authors Guild is 2026-09-21 (says 'released last Thursday'), the Haskell post is 2026-09-18, Privatemode is 2026-09-24. Batch 2 dated all three as 09-26/09-27 off the HN timestamp. Fetch the article and read its own dateline before writing the date. hnrss q=AI returned the 552-byte empty envelope on all 3 retries for the SECOND consecutive day - Algolia front_page was again the only source for the lead. q=LLM was healthy (15,976 bytes) but 0 in window. DEDUPES DROPPED: NV-Reason-CT (developer.nvidia.com re-dated a 09-23 post to 09-26 in its RSS - same URL already ran in the 09-24 digest, so NVIDIA re-dates like TechCrunch does), DeepSeek DSec arXiv 2609.22978 (already in 09-23 digest, batch 2 re-offered it), 'One Month Without AI' (already ref #8 yesterday), and TechCrunch's Meta Connect glasses post (feed pubDate 09-26 but URL path /2026/09/25/ - already ref #11 yesterday). KEYWORD SCREEN FAILED HARD on Theo's 'So much for Pacing the Frontier': scored 1 of 5,339 words because the ASR wrote 'Gro 47', 'Opus 55', 'GPT6 Soul and Luna', 'Daario', 'Clawude' and 'GBD6' - a near-zero score on a known AI channel means the regex broke, not that the video is off-topic. It was the single best safety item of the day. Musk/CGTN scored 23 and was worth full depth (US-China safety committee, Grok 4.7 behind Opus 5.5, China lithography in 2-3 yrs). BATCH 2 VERDICT: no fabrications detected this run - all 5 agent-only candidates I probed returned 200 and 3 of 4 checkable ones matched Algolia points exactly. Kept 3 (arXiv 2609.25021 chat-template self-reports, reasonable.io TLA+, Reladraw 329pts), dropped token-space fonts (unverifiable as notable), Intel 8087 and Go Concurrency (not AI), LightCloud (5 pts). Its only real errors were the three publication dates above and an unsupported causal claim that the 2.5h kill delay was due to 'operational gaps in automatic shutdown protocols' - the report does not say that. Agent also mislabeled the two hnrss feeds as 502 failures when q=LLM was actually healthy."
