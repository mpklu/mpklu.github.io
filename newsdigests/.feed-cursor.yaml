last_run_date: "2026-10-20"
last_summary_file: "content/newsdigests/2026-10-20-daily-digest.md"
notes: "TUESDAY RUN. last_run_date was 10-19 == yesterday, so the window was ON OR AFTER 2026-10-19 minus the 44 reference URLs from the 10-18 and 10-19 digests. 31 refs: 29 blog, 2 video. TWO TRANSCRIPTS.
  RACE CONDITION WAS REAL THIS TIME AND THE LOG MTIME LIED. /tmp/blog-yt-fetch.log last written 08:08, run started 08:23 — looks finished — but `pgrep -fl yt-dlp` showed a LIVE download of H2mvc0miJ-w. I resolved the ID before assuming: it is a 2018 MangoTV Chinese music video (6:17), a stray interview-search result that would be screened out anyway, so there was no real race. ALWAYS pgrep, never trust the log mtime; and resolve the pending ID rather than waiting blind.
  THE DAY HAS TWO HEADLINE CLAIMS POINTING OPPOSITE WAYS AND THAT IS THE DIGEST'S SPINE. (1) Jack Clark told the IMF the singularity has begun — Per Jacobsson Lecture, Bangkok, SATURDAY 10-17, published as Import AI 477 on 10-19. The SPEECH is out of window; the SELF-PUBLISHED TEXT is in window and is the primary. (2) MIT TR on Nick Cammarata's 26,000-word interpretability claim, with three named critics given equal weight. One says capability is outrunning us, the other says legibility might catch up.
  THE RUNDOWN EMBELLISHED THE CLARK STORY AND THE PRIMARY DISPROVED IT. The Rundown (10-20) framed it as 'serious job disruption' plus 'a short window to decide if AI needs an intelligence cap.' I fetched jack-clark.net and the lecture does NOT discuss job losses and does NOT mention any intelligence cap. The benchmark numbers it gave (HLE 8%→67.7%, FrontierMath 2%→94%, $44T) ARE all in the primary. So the secondary was right on the checkable numbers and invented the framing — the more dangerous pattern, because verifying the numbers makes you trust the rest. ALSO: the $44T is explicitly CONDITIONAL ('if you assume... then under these singularity-esque conditions') and Clark calls it 'outlandish' himself; reporting it flat would be a misquote by omission.
  SECOND-BEST SYNTHESIS OF THE RUN, AND IT IS CROSS-DOMAIN: AI-GENERATED NOISE IS DROWNING HUMAN REVIEWERS IN TWO UNRELATED INSTITUTIONS ON THE SAME DAY. Hinsliff in the Guardian has UK employment tribunal cases up 39% in a year, AI-generated FOI requests swamping Whitehall, and judges reading citations to cases that do not exist. Phoronix has Linux 7.4 RETIRING EDAC DRIVERS OUTRIGHT because of an 'AI Generated Fixes Frenzy' — maintainers deprecating working code because defending it from well-meant machine output costs more than the code is worth. That follows 10-19's TAINT_FORCED_BIND. Whitehall and the kernel tree have the same problem; nobody else framed them together.
  DYLAN FIELD VIDEO IS 12 DAYS OLD AND THE ANCHOR WAS AN OFFHAND 'LAST NIGHT'. Published 10-19, but he says on-mic 'the math drop last night from OpenAI of 700 plus papers'. I dated it via the COMPANION GITHUB REPO, not the 403'd announcement: github.com/openai/math was CREATED 2026-10-06 and its README says '719 manuscripts organized into 372 families' — matching his '700 plus'. So filmed ~10-07. Disclosed in the entry. THIS IS THE SECOND CONSECUTIVE DAY a creator video published in-window was really filmed around 10-06/10-07 (Theo yesterday said 'filming this on October 6th'). The repo also carries the hedges the blog post omits ('Some of the unformalized results could have issues', '~42% top-line results formalized') — the companion-repo lesson paid off twice in one item.
  QUOTE VERIFIER: 47/47 VERBATIM on the final pass, denominator 47 (NOT a curly-quote zero-denominator false pass). It caught ONE GENUINE SERIOUS DEFECT plus six case-only errors. The real defect: I had written 'Safety is paramount... You don't choose between safety and capability. They are one.' as ONE span with an ellipsis — those two are NON-CONTIGUOUS in the transcript and separated by another speaker saying 'Yeah'. That is the merged-quote-across-attribution failure in its purest form, now hit on 10-14, twice on 10-15, and again today. SPLIT INTO TWO SPANS. The six case-only misses (e.g. 'The data of Germany' vs source 'the data of Germany', 'We simply' vs 'we simply') are worth keeping strict about: a case change inside quote marks is not verbatim. Method that works remains SPLIT THE LINE ON THE QUOTE CHARACTER AND TAKE ODD-INDEXED SEGMENTS.
  FIVE QUOTES CAME FROM AGENT-SUPPLIED CONTENT I HAD NEVER FETCHED MYSELF and the verifier flagged every one as a MISS purely because they were absent from my corpus. I then fetched all five sources and ALL FIVE WERE VERBATIM ('change the stakes', 'Industry 4.0 Platform', 'Check for Me', 'Review outline notes', 'Review producer notes'). Lesson both ways: the agents did not fabricate, but a quote you have not personally fetched is unverified no matter how trustworthy the summary reads — and the verifier only works if its corpus contains every cited source.
  BYLINE CHECK, THIRD RUN AS POLICY, AND IT INVERTED YESTERDAY'S RESULT. Yesterday Lucas Ropek was a DECOY in TechCrunch's related-article rail; TODAY HE IS THE REAL AUTHOR of two pieces (Nscale/Anthropic, Hugging Face evaluators), confirmed from <meta name='author'> AND the json-ld author STRING. So 'Ropek appeared yesterday as a decoy' is not evidence about today — verify every time, per article. All 10 bylines verified: Bort x2, Ropek x2, Aditya Mehta, Ivan Mehta x2, Heaven, O'Donnell, Hinsliff, Larabel x3 (Phoronix 'Written by ... on <date>' line, which also gave independent timestamps).
  CNBC JSON-LD NEARLY GAVE ME A FALSE BYLINE VIA MY OWN REGEX. A naive `\"author\"...\"name\"` regex on the DeepSeek page returned 'Jenny Lee' — who is a VENTURE CAPITALIST in a DIFFERENT CNBC headline the same day. Parsing the ld+json blocks properly and matching the headline showed the article's real authors are Jenny Lee AND Kai Nicol-Schwarz (both with cnbc.com author-page URLs), so the name was coincidentally right but my method was wrong. PARSE THE BLOCK, MATCH THE HEADLINE, never regex the raw HTML for an author field.
  DATE TRAP CAUGHT BY THE AGENT, NOT BY ME: the DeepSeek federal ban was ORIGINALLY ISSUED 24 JULY and merely MADE PUBLIC on Monday. 'U.S. bans DeepSeek' reads as a Monday action and is not. Wrote it as the disclosure it is.
  TIMESTRAL KILLED FOR THE SECOND DAY RUNNING. Lobsters re-surfaced mistral.ai/news/timestral on 10-19; json-ld datePublished is still 2026-07-15. Batch 2 independently reached the same verdict unprompted. A feed can re-stamp an old item every day — the kill has to be repeated, not remembered.
  THE REGISTER IS GENUINELY DOWN, NOT BLOCKING US. headlines.atom 302s to api.theregister.com/api/v1/article?... which returns HTTP 500 / 0 bytes; software/ai_ml/headlines.atom and headlines.rss also 500. Confirmed independently by batch 2. This is an upstream API outage, NOT the 'stale AI feed' condition logged yesterday — do not conflate them, and retry next run rather than recording a content zero.
  WEBFETCH IS DOMAIN-BLOCKED FOR theverge.com AND theguardian.com from my own tool ('Claude Code is unable to fetch'), while the haiku agents fetched Guardian pages fine and plain curl with a browser UA works for both. So a WebFetch domain refusal is a TOOL-LEVEL restriction, not evidence the source is unreachable — fall through to curl immediately.
  AGENTS: NEITHER FABRICATED; both asked about prompt injection, both reported none. Batch 1 (labs) was honest about its own limits — flagged the OpenAI 403 and fell back to the RSS description SAYING SO, and reported partial extraction on a Google item rather than padding it. Batch 2 was again the stronger half and was the SOLE SOURCE of the DeepSeek July-24 detail, the Mamdani piece, the Otter/Yelp items and the Guardian cancer study. MY OWN SWEEP was the sole source of the Jack Clark thread (via Rundown), both Phoronix AI items, the Verge CoreWeave/fossil-fuel/Amazon-nuclear cluster, the Guardian Hinsliff column and both Stack Overflow posts. TWELFTH-PLUS CONSECUTIVE RUN WHERE NEITHER SIDE WAS REDUNDANT — KEEP RUNNING THE CONCURRENT PARSE. Also: my sweep printed 'in-window of total (newest=...)' per feed, which makes a true zero self-evidencing; keep that output shape.
  hugo --minify exits 0. check_post.py: 0 ERRORS, 14 warnings, all long-sentence/em-dash style. MEAN SENTENCE 31.5 WORDS after splitting the four worst offenders (114, 100, 77, 76) — best of the recent runs (34.3 on 10-18, 44.0→40.0 on 10-19). References rebuilt in order of first citation: 31 body URLs map 1:1 onto 31 references, zero orphans in both directions, order verified. Zero future-dated strings. 6 h2 / 30 h3. Both cited transcripts re-ls'd and still present at commit time (no prune race).
  NOTE FOR NEXT RUN: Edit tool was PERMISSION-DENIED on content/newsdigests/*.md while Write was allowed; I rewrote the whole file via Write instead. Not a bug, just the permission shape — budget for full-file rewrites when revising a digest.
  SOURCE-FILE DEBT STILL NOT FIXED, TWENTY-EIGHTH RUN: `git log -- .feed/source.md` still shows ONE commit (c6f320a, 2026-04-01). Carried manually again and absent from the file: theguardian.com/technology/rss (biggest or near-biggest source three days running), CNBC tech+top RSS, theregister.com/headlines.atom, theverge.com/rss, technologyreview.com/feed, phoronix.com/rss.php, anthropic.com/news, anthropic.com/research, claude.dev/blog, feeds.arstechnica.com/arstechnica/technology-lab, stackoverflow.blog/feed, oneusefulthing.org/feed, niemanlab.org/feed, jack-clark.net (NEW — carried today's lead and is a primary for Anthropic policy thinking). Per the known 'not writable from the digest run' failure I did NOT re-flag it in-file; ESCALATED TO THE HUMAN IN THE RUN REPORT INSTEAD."
