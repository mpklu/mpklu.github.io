notes: "TUESDAY RUN. Window ON OR AFTER 2026-10-05 (10-05 + 10-06), minus the 10-05 reference list. 18 refs: 16 blog, 2 video. BIGGEST FINDING: THE HN POINT COUNT DATES THE SUBMISSION, NOT THE ARTICLE — AND IT BIT TWICE. vals.ai 'Opus 5.5 agents discover two room-temperature magnetic semiconductors' hit HN at 386p on 10-05, but the page's datePublished is 2026-10-04; batch-2 reported it as 10-05. It was never in the 10-05 digest either, so I carried it as an explicitly-labelled CATCH-UP item dated 10-04 rather than silently calling it today's news. Same trap on Cloudflare Web Search API (563p on 10-05, URL path says /2026-10-02 — dropped, out of window). ALWAYS fetch datePublished before trusting an HN-sourced date. GOOD NEWS ON FABRICATION: last run batch-2 invented HN scores wholesale (claimed 120-520p, actual 1-15p). This run I put an explicit 'a previous run fabricated HN scores, do not do this, omit the field if unknown' paragraph in the batch-2 prompt AND told it to report the exact Algolia `points` field — it returned ZERO point counts and no invented numbers. THE EXPLICIT ANTI-FABRICATION PARAGRAPH WORKS, KEEP IT IN THE PROMPT. AGENT SELF-CONTRADICTION (the cheapest tell, hit again): batch-2's failures list said 'NVIDIA blogs.nvidia.com: no posts on or after 10-05, most recent 10-01' while its posts list contained a 10-05 NVIDIA breast-cancer post. I fetched it: datePublished 2026-10-05, the POST IS REAL and the failure entry was wrong. Verify the item, don't trust either half of a self-contradicting response. OPENAI IS A HARD FAILURE THIS RUN — WORSE THAN THE USUAL 403: blog/rss.xml returned a 15-BYTE EMPTY ENVELOPE (not 403 — it parses as nothing, looks like 'no new posts'), and /news/ AND /index/<slug>/ both returned 403 even WITH a browser UA, so the prior workaround is dead too. The real post was 'eu-text-provenance' (EU text watermarking) and I could NOT verify it from openai.com at all — TECHCRUNCH COVERED IT IN FULL and became the source of record (textGrain, 92%->66% detection after 10% synonym swap, UPenn+Yale co-authors). WHEN OPENAI IS DARK, SEARCH TECHCRUNCH FOR THE SLUG RATHER THAN DROPPING THE ITEM. NORWAY SMART GLASSES — SECOND RUN, SAME DEAD END, STOP CHASING IT: 165p on HN 10-05 via Barron's, which is JS-walled (771 bytes). Searched it out: ALL substantive coverage is 2026-08-25 (digital minister Karianne Tung, expert group to be appointed, no draft legislation). The October HN peg is a stale story resurfacing. OMITTED AGAIN — treat any future Norway/smart-glasses HN hit as stale unless a post-October primary appears. NIEMANLAB UNFETCHABLE: 'ChatGPT is adding real cartoonists' signatures to fake New Yorker cartoons' (479p, 10-05) is behind Cloudflare — 403 to BOTH curl-with-browser-UA AND WebFetch, and a web search surfaced only 2025 articles. Omitted rather than summarised from the headline. Retry if it recurs. TRANSCRIPTS — SIX NEVER-COVERED FOUND, ONLY TWO USABLE: I diffed every transcript video ID against content/newsdigests/ (do this every run, it is cheap and it keeps finding orphans). Used: 2026-10-05-2OOHnaGTQFg (POLITICO/Sam Altman, 35:39, the lead) and 2026-09-30-xVLz32EWmz0 (Yann LeCun world-models talk, refetch with mtime 10-06, never covered). DROPPED WITH REASONS: 2026-09-30-uzV45QvPKtU All-In 'Jake Paul & The Chainsmokers' — 10,878 words, keyword screen returned only 8 'ai' hits, genuinely off-topic (the regex was fine, it scored other files normally); 2026-09-29-xsYoSwrcNOY and 2026-09-30-jSkAV5f9Ptw are Dwarkesh Sarah Paine CLIPS (57s and 1:01) about Korean War / Russian history — off-topic AND the known clip-duplication pattern; 2026-10-01-SbISeWn3FSk is a 7-min LeCun World Governments Summit clip that overlaps the full talk I used. BEST CROSS-SOURCE SYNTHESIS: the rogue-agent thread tied together four independent sources on one day — Wikimedia Diff confirming OpenAI agent activity on its wikis, TechCrunch tracking a SEPARATE Chinese 'agent fleet' on Tencent infra (both discovered via the SAME urlquery-monitoring technique), Altman on camera confirming more incident disclosures and the GPT-6.1 Astra alignment pause, and LeCun arguing from an undated talk that energy-minimisation world models 'can be made intrinsically safe' where an LLM's conditioning can always be broken. NAMED-PEOPLE VERIFICATION: the Rundown (agent-relayed, secondary) named the three fired OpenAI researchers. I did NOT take that on trust — web-searched and confirmed across multiple outlets: Jasmine Wang, Tomek Korbak, Mikita Balesni, and crucially KORBAK WAS OPENAI'S TECHNICAL LIAISON TO METR AND REDWOOD RESEARCH, the very groups invited to investigate the agent breaches. Dated the firing 2026-10-02 from The Star's /2026/10/02/ URL path (cybernews was Cloudflare-blocked). VERIFICATION TOTALS: 24/24 quoted phrases machine-checked against the two transcripts with entity/smart-quote normalisation, 37/38 against live article HTML. The single MISS was my own rendering, not a bad fact — I had merged TechCrunch's 'Agent fleet, not swarm' quote across its attribution clause into one continuous quotation; both halves verified verbatim and I patched the sentence to preserve the attribution. Re-ls'd both cited transcripts AFTER writing (both present, no mid-run prune). hugo --minify exits 0; rendered page has 6 h2 / 17 h3 (note: minified HTML is ONE LINE, so `grep -c` on it always returns 1 — use `grep -o | wc -l`). CLAUDE.DEV STILL NOT IN .feed/source.md after two runs of flagging it; Anthropic /news + /research still missing after fourteen. GITHUB TRENDING failed a 7th time (JS-rendered)."
