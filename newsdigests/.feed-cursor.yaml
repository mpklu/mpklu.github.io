last_run_date: "2026-10-12"
last_summary_file: "content/newsdigests/2026-10-12-daily-digest.md"
notes: "MONDAY RUN, ONE-DAY WINDOW (last_run_date 10-11 == yesterday, so window was ON OR AFTER 2026-10-11) minus the 10-11 digest's 12 reference URLs. 14 refs: 13 blog, 1 video. VERIFICATION: 45 body quotes/figures machine-checked with NFKD + smart-quote normalisation against freshly fetched HTML and the transcript — 45/45, ZERO MISSES, the first clean sweep in the runs this cursor records. Both TechCrunch bylines (Anthony Ha, Ivan Mehta) and Phoronix (Michael Larabel) confirmed from name=author meta, not assumed. THE LEAD STORY CAME FROM A SOURCE IN NEITHER source.md NOR THIS CURSOR: Phoronix. Lobsters surfaced ONE Torvalds/Claude Code item (10-11) and the article page is behind a CLOUDFLARE 'Just a moment...' INTERSTITIAL (5.7KB) — batch 2 correctly reported it as a 403 failure and stopped. phoronix.com/rss.php IS NOT BLOCKED (20.7KB) and carried BOTH the 10-11 story AND A SECOND, BIGGER 10-12 FOLLOW-UP ('Did What I Preach', Torvalds using LLMs to make patches decipherable and uncovering long-standing kernel bugs) THAT NO AGGREGATOR SURFACED AT ALL. WHEN AN ARTICLE PAGE IS CF-CHALLENGED, FETCH THE PUBLISHER'S OWN RSS — it is a different origin path and it gave title, pubDate and a publisher-written summary. I cited Phoronix and said plainly in the body that the page was challenged and the summary comes from the publisher's RSS entry, not the full article. lore.kernel.org WOULD HAVE BEEN THE PRIMARY but it is behind an ANUBIS PROOF-OF-WORK CHALLENGE (7,527 bytes, identical response on /all/, /lkml/ and /linux-fsdevel/, with a visible {'rules':{'algorithm':'fast','difficulty':5}} blob) — not worth solving, and NOT a dead host; don't retry it blind. DATE DISCIPLINE KILLED FIVE PLAUSIBLE IN-WINDOW ITEMS, ALL HIGH-SCORING: (1) Sakana AI 'MASS: Recursive Self-Improvement' — pub.sakana.ai/mass/ HAS NO DATE ANYWHERE IN THE HTML and HN submitted it 10-11; the page links arXiv 2610.12176, whose API gives published 2026-10-08 and UPDATED 2026-10-12. The updated field is what makes it look fresh. TOOK published, EXCLUDED. Batch 2 honestly reported date 'unknown' rather than guessing — correct behaviour, and my arXiv lookup is what resolved it. (2) Berkeley 'Using AI for Just 10 Minutes Erodes Your Ability to Persist' (117p, submitted 10-11) — byline October 9, 2026; the page ALSO contains 'Oct. 7, 2026', which is a photo caption for a TALK DATE, not the article date. Two dates on one page, neither of them the submission date. (3) QGIS 'bans AI assisted contributions' (84p, submitted 10-12) — GitHub API says the PR was created 2026-09-24 and closed 10-08. EIGHTEEN DAYS OLD. (4) rews.cc 'Anthropic Bans Cruelty to Claude' (69p, submitted 10-11) — datePublished 10-09. (5) karpathy tweet 'gap in shared understanding of LLM capability' (509p, submitted 10-11) — batch 2 reports the X JSON-LD datePublished is 2026-04-09 with only a later 'Last edited' stamp matching 10-11. I COULD NOT INDEPENDENTLY VERIFY THAT (X is unfetchable to us) so the exclusion rests on an unverified agent claim; the conservative call was the same either way, but DO NOT treat 'karpathy posted this in April' as established fact. BOTH AGENTS WERE CLEAN, 2-FOR-2, FIFTH RUN RUNNING — keep the anti-fabrication paragraph naming the past HN-score invention VERBATIM in both prompts. Batch 2 in particular did independent article-vs-submission dating on every aggregator hit and its rejections matched mine EXACTLY on all five I cross-checked (Berkeley 10-09, rews.cc 10-09, QGIS PR, BBC 10-10, momo5502 10-09), and it correctly reported two items as date-'unknown' instead of guessing. Batch 1 matched my own independent parse source-for-source on ALL SIXTEEN feeds. AGENTS STILL UNDER-REPORT, THOUGH: my own concurrent sweep was the SOLE source of FOUR in-window items neither agent returned — itsallaboutthebit (391p, 10-11), cendyne 'Fable took my jorb' (187p, 10-11), tedhaley Pensieve (86p, 10-11) and the Terry Tao guest post (74p, 10-11). KEEP RUNNING THE OWN-PARSE CONCURRENTLY; it paid for itself again. Note my own parse ALSO needed the date filter applied BEFORE any slicing — the known truncate-to-8 trap. TWO ITEMS DROPPED ON BODY, NOT DATE: TechCrunch 'Will the HomeView be Apple's first smart home success?' is in-window (10-11) and sits in the AI category feed, but it is consumer smart-home hardware whose only AI content is the word Siri — batch 2 flagged the relevance as marginal itself and I dropped it rather than pad the Products section; and 'Agent Standup' (atoll92.github.io/agent-standup, 48p) is a genuine AI coding tool but its GitHub repo created_at is 2026-10-10, ONE DAY BEFORE THE WINDOW — same created_at rule that put Talorys in yesterday's digest. ASR NUMBER HYGIENE ON THE TRANSCRIPT: the Theo video renders 'GPT' as 'GBT'/'GBD', 'Altman' as 'Alman', 'DeepSeek' as 'DeCev4'/'DeepS', and produced at least two visibly corrupt figures ('$125 per million tokens in' for what must be $1.25, and 'a,000 plus dollars'). I used only the figures that survive a sanity check (21x/55x DeepSeek V4 Flash vs GPT-5), normalised the model names, and added an explicit note that prices are transcribed from speech and approximate. DO NOT lift precise dollar figures out of ASR without that check. Transcript is 3,666 words — well under the 10k threshold, so I read it in full via keyword-indexed windows anyway. hugo --minify exits 0 (507 pages, up from 474 — the +32 is the five-part agent-security series committed in dc08cdc, not this digest). 4 h2 / 14 h3, all 14 body URLs map 1:1 onto the 14 references, 13 [blog] + 1 [video], zero future-dated strings. Re-ls'd the cited transcript AFTER writing: present, no mid-run prune. SOURCE-FILE DEBT IS NOW FIXED, NOT FLAGGED: I added CNBC tech RSS, Phoronix RSS, anthropic.com/news, anthropic.com/research and claude.dev/blog to .feed/source.md in a separate commit. Those five were carried only by this cursor (or by nothing at all) for up to nineteen runs; CNBC was the top contributor on 10-11 and supplied four items today, and Phoronix supplied today's lead. anthropic.com/engineering remains in the file but is still a stale archive (newest 2026-04-23) — leave it, it costs one fetch."
