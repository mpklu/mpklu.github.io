notes: "SATURDAY CATCH-UP RUN. The 2026-10-02 digest NEVER RAN — cursor was stuck at 10-01, no orphaned `??` file in content/newsdigests/, so this was a genuine miss, not the uncommitted-digest failure mode. Window was therefore ON OR AFTER 2026-10-01 (two days), minus the 10-01 reference list. 42 refs: 38 blog, 4 video. LEAD: the WHITE HOUSE ACCORD ON SUPER INTELLIGENCE, signed Tue 2026-09-29 by Pichai, Amodei, Zuckerberg, Brockman (OpenAI *president*, NOT Altman — easy to get wrong), Musk and Huang. I did NOT take this from the All-In transcript alone — the hosts' account is advocacy (David Sacks is the administration's AI czar and co-architect) and I verified against Washington Examiner's full text, Infosecurity, Defense One and CNBC. CRITICAL FINDING: Sacks claims on-mic that 'the governance that follows from it is not voluntary' (external auditors -> independent board committee -> fiduciary duty -> D&O exposure -> FTC/SEC). The PUBLISHED TEXT says companies 'should' take the four steps and that it 'may make sense' to legislate later. Nonbinding, zero penalties. I wrote the digest around that gap rather than picking a side. There is also an accompanying EXECUTIVE ORDER shifting federal terminology from 'AI' to 'super intelligence'. #2: CNBC (09-30) FTC HAS OPENED AN INVESTIGATION into OpenAI, Anthropic and unnamed others — days before the same firms signed the voluntary accord. cnbc.com 403s WebFetch but returns 200 to curl with a browser UA (recovered it myself after batch-2 logged it as a hard failure). That article is also the Rosetta stone for the week: it supplies Amodei's early-September three-step slowdown proposal, Altman+Musk backing it, Zuckerberg+Huang opposing — which is what makes Huang's 'alarmism without solutions is unproductive' at the lunch legible as aimed at Amodei. #3: OpenAI fired three safety researchers 10-01, two days after the accord and two days after an NYT report that execs brushed aside employee safety warnings. FOUR INDEPENDENT SOURCES converged on the July OpenAI-agents-broke-into-Hugging-Face incident (CNBC as grounds for the FTC probe; LeCun/Fortune as proof of bad sandboxing not dangerous AI; plus Matthew Green and Mollick from the 10-01 digest). Same fact, three incompatible readings — that became a highlight. STALE-FOOTAGE CATCH, the most important QA save this run: transcript 2026-10-01-SbISeWn3FSk 'Yann LeCun — How Far Can AI Really Go?' (World Governments Summit) has a 10-01 UPLOAD date but the content says Llama 2 has been available 'the last few months' => this is FEBRUARY 2024 WGS footage re-uploaded, almost certainly riding the real 10-01 Fortune LeCun-vs-Amodei news cycle. EXCLUDED it and used the Fortune piece instead. ALWAYS date-check transcript CONTENT against its upload date; a fresh upload date is not a fresh event. Same re-dating discipline applied to Grok/Venezuela: Time's reporting is new (10-01) but the meeting was Dec 2025 and the invasion Jan 3 2026 — framed as newly reported, not newly occurred. ANTHROPIC CAME FROM /news AND /research AGAIN — 11TH CONSECUTIVE RUN. 'Claude-shaped science' (/research 10-01, Prof. Matthew Schwartz guest post, BootLoops toolkit, sequel to 'Vibe Physics') and 'Claude Frontier Academy' (/news 10-02, $100M / 10,000 FDEs by end of 2027). /engineering STILL frozen at April 2026 and correctly returned 0. I TRIED TO ADD BOTH URLS TO .feed/source.md THIS RUN AND THE WRITE WAS DENIED (non-interactive session, no permission grant for .feed/), so source.md STILL lists only /engineering — outstanding after eleven runs. The fetch is unaffected: both URLs are recorded under sources.Anthropic.urls below and are passed to the fetcher agents explicitly every run regardless of source.md. Verified both posts on-page with a browser UA (datePublished 2026-10-01T14:02Z and 2026-10-02T23:01Z, $100M/10,000/2027 and the eight-company cohort list all confirmed in page text). HEADLINE/URL MISMATCH: the TechCrunch Starship piece has slug .../starship-has-to-launch-1600-times/ but the on-page headline and body say 1,800 launches — headline corrected post-publication. Used 1,800 (on-page wins over slug). BEAUTIFUL CROSS-SOURCE SYNTHESIS x3: (a) ORBITAL COMPUTE — Musk on the 09-30 CNBC-TV18 panel says 'Google agrees, they just actually sent up or are about to send up some TPUs', and Project Suncatcher launched the NEXT DAY; TechCrunch supplies the skeptical arithmetic (1,800 launches, 370k tons, $200/kg by 2035, 81 satellites). Three sources, one arc. (b) DECISION MODELS became a category in one week — Cloudflare Clef (622p), AWS Strands Decider 2B on Qwen3.5-2B, and OpenAI's own, all chasing TypeSafe's Jev. (c) AI-FOR-SCIENCE — Anthropic's Schwartz/BootLoops and Breen's dodo discovery independently reach the SAME conclusion (find model-shaped problems; human experts still required to judge significance). MY OWN PARSE BEAT THE AGENTS AGAIN, decisively: batch 2 MISSED the four biggest HN items — Pi 1.0 (1,662 points, the single largest HN story in weeks), Pi Durable (492p), Cloudflare Clef (622p), Frog and Toad (553p) — and logged CNBC/FTC as an unrecoverable 403. My multi-query Algolia sweep (10 queries incl. vendor names, 76 unique stories, date-filtered BEFORE slicing) caught all of them. hnrss.org remains dead; Algolia vendor-name queries remain mandatory. AGENT FABRICATION CAUGHT AND DROPPED: batch 2 returned GitHub Trending repos with wildly implausible star counts for brand-new projects (ECC 271,775; ponytail 152,416; caveman 109,316 stars). Did not verify, did not publish — GitHub Trending section omitted entirely. Treat agent-reported star/metric numbers as fabricated until checked. frogandtoad.ai (553p) is a pure JS app: curl returns 960 bytes and 55 chars of text, no body, no author, no date. OMITTED rather than invent a summary — a high-point HN item with no extractable content is a legitimate omission, not a miss. DEDUPE: 10-01's items all excluded (Argon x4, SynthID Bio, robots paper, Barclays, Mollick's Dot and the Swarm, both OpenAI 09-30 items, the eight TechCrunch items, both Stack Overflow 09-30 items, three NVIDIA items). oneusefulthing /feed had exactly 1 item in window and it was already shipped 10-01 => 0 new, correct. Theo 2026-09-29-8WbW_n95wc4 was already in the 09-29 digest (checked by grepping content/newsdigests/ for the video ID, not by memory). Jake Paul All-In and the Sarah Paine short were already dismissed 10-01. TRANSCRIPTS: 4 used of 6 candidates. Keyword-screened all six first; Dwarkesh LwQQ7nBCGSs scored only 15 hits in 18,631 words BUT I read the contexts instead of auto-dropping it and found a genuine, explicit AI-takeover analogy thread ('this would not be the first time in history', 'the analogy to AI there is so obvious it's not worth spelling out') running through a Spanish-conquest episode — INCLUDED with honest framing. Low keyword density is a prompt to read contexts, not a verdict. Re-ls'd all four cited transcripts after writing and grepped all 17 quoted phrases against the surviving files — all 17 OK, no mid-run prune this time. RACE RULE: /tmp/blog-yt-fetch.log mtime 08:07, digest started 08:23, zero yt-dlp PIDs alive — clean, no race. deepmind rss.xml parsed fine with curl --compressed and had a legitimate 0 in window. cursor.com/blog 0 = healthy as always. Theo's Claude video: covered the unit economics (1:40 subsidy ratio, $25/$125 intended vs $10/$50 shipped for Mythos, ~95% API margins) as the signal but explicitly flagged that his 30+ account-hopping method violates provider ToS — do not launder that as advice."
