notes: "SUNDAY RUN, ONE-DAY WINDOW (last_run_date 10-10 == yesterday, so window was ON OR AFTER 2026-10-10) minus the 10-10 digest's 16 reference URLs. 12 refs: 11 blog, 1 video. VERIFICATION: 73 body quotes/figures machine-checked with NFKD + smart-quote normalisation against fetched HTML and the transcript. ONE MISS, AND IT WAS A FALSE POSITIVE OF EXACTLY THE KNOWN KIND: 'Tesco, Morrisons, and Asda' missed because CNBC wraps 'Tesco' in a quote-link <a> tag, leaving 'Tesco , Morrisons' with a space before the comma after tag-stripping. Same artifact as the Anthropic italicised-'persistence' miss on 10-10. The claim was correct. BIGGEST WIN OF THE RUN IS A SOURCE-LIST GAP, NOT A STORY: CNBC's tech RSS (https://www.cnbc.com/id/19854910/device/rss/rss.html) carried FOUR in-window AI stories and is NOT in .feed/source.md. Without it this digest would have been three TechCrunch items and a sponsored newsletter Q&A. On a weekend, when the labs and the big blogs go quiet (Anthropic, claude.dev, OpenAI, all four Google feeds, DeepMind, NVIDIA x3, Stack Overflow, Cursor, One Useful Thing, Addy Osmani, BAIR: ZERO in window, every one of them alive and fetched), general tech-press RSS is where the AI news actually is. ADD CNBC TO source.md. TRANSCRIPT DUPLICATE CAUGHT BY N-GRAM OVERLAP, NOT BY EYE: 2026-10-09-lFyNu4eBrBE 'Satya Nadella and Jensen Huang discuss Hybrid Intelligence' (channel 'Windows', 24:22) had NEVER been cited and looked like the Nadella+Huang interview I'd been told ytsearch lag drops. It is a 91.1% 5-gram overlap with 2026-10-07-RE_AsVyoOSQ (the full Windows event, already covered) — a channel clip of the same stage segment. DROPPED. RUN THE 5-GRAM OVERLAP TEST ON ANY 'never covered' TRANSCRIPT BEFORE TREATING IT AS NEW; a 0-hit grep for the video ID across past digests proves nothing about the CONTENT. The Musk transcript scored no overlap against any other transcript — genuinely new. DATE DISCIPLINE PAID THREE TIMES, ALL AGAINST HIGH-POINT HN STORIES THAT LOOKED IN-WINDOW: momo5502 'Decompile a FPS' (109p, submitted 10-11, ARTICLE 2026-10-09 per URL path and meta), Warren/Blumenthal data-center letter (56p, submitted 10-10, article 10-09), arXiv 2610.05978 'Byte Language Models' (Lobsters-dated 10-10, arXiv API published 2026-10-05). The arXiv ABS PAGE HAS NO PARSEABLE SUBMISSION DATE — export.arxiv.org/api/query?id_list=<id> does, in <published>. USE THE API, NOT THE ABS PAGE. Also TechCrunch 'Anthropic can't reliably control' has pubDate 10-10 UTC but URL path /2026/10/09/ — URL path trusted, correctly excluded as already covered. Zero future-dated items anywhere. DROPPED A 184-POINT STORY FOR BEING OFF-TOPIC: geohot's 'Lobbying' is verified 10-10 and in-window, but the full text is satire about American campaign finance with NO AI content; batch-2 classified it 'analysis' on the strength of the byline. CHECK THE BODY, NOT THE AUTHOR'S USUAL BEAT. PAYWALL HANDLING: FT Nvidia/Reflection AI 403'd and WSJ Tom Brown 401'd. Nvidia/Reflection corroborated by Reuters + Bloomberg + Seeking Alpha headlines (all 10-10) so I cited the FT primary AND said plainly in the body that it is paywalled and unverified by us. The $25B valuation appeared ONLY in aggregator headlines (Dealroom, TIKR) so I OMITTED IT — don't launder an aggregator number into a primary. WSJ dropped entirely: Google News dates that story 10-09 (out of window) and the '$1.25B/month' figure existed only in an HN submitter's title. AN HN TITLE IS NOT A SOURCE. VERIFIED A TRANSCRIPT CLAIM BEFORE PUBLISHING IT AS NEWS: Musk discusses 'you acquired Cursor' — the SpaceX/Anysphere deal was announced 2026-06-16 at $60B and CLOSED 2026-08-14, so his remarks are RETROSPECTIVE RATIONALE, not an announcement. Framed as such. Medal of Science ('this past week') confirmed awarded 2026-10-08. AGENTS WERE CLEAN, 2-FOR-2 — keep the anti-fabrication paragraph naming the past HN-score invention VERBATIM in both prompts; it has now held four runs running. Batch 2 independently did article-vs-submission date verification on every HN hit and its results matched my own fetches EXACTLY on all four I cross-checked (decomp 10-09, Warren 10-09, geohot 10-10, nishtahir 10-10). It also correctly refused to include six items whose dates it could not establish rather than guessing. MY INDEPENDENT PARSE matched batch-1 on OpenAI (newest 10-09, 0 in window), Google (0 across four feeds), DeepMind (0, newest 10-06) and Anthropic (0), and matched batch-2 on TechCrunch (4 in-window, same URLs). ONE UNEXPLAINED DISCREPANCY, HARMLESS: my claude.dev fetch returned 15,370 bytes, batch-1's returned 77,758; both agreed the newest post is building-effective-agent-automations (10-08), so the conclusion holds. Talorys date came from api.github.com (created_at 2026-10-10) after both the agent and I failed to find one in the repo HTML — THE GITHUB API IS THE DATE SOURCE FOR REPO SUBMISSIONS. Its star count moved 619 (API) during the run; I described it without a number. hugo --minify exits 0 (474 pages, up from 473); rendered page 6 h2 / 12 h3, matching source exactly, and all 12 body URLs map 1:1 onto the 12 references. Re-ls'd the cited transcript AFTER writing: present, no mid-run prune. SOURCE-FILE DEBT, NOW THREE ITEMS: anthropic.com/news + /research absent from .feed/source.md after EIGHTEEN runs (only fetched because this cursor passes them explicitly); claude.dev missing after SIX; and now CNBC tech RSS, which was the single biggest contributor to today's digest. Only anthropic.com/engineering (a stale archive, newest 2026-04-23) is actually in the file."
