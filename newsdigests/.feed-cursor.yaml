notes: "FRIDAY RUN, ONE-DAY WINDOW (last_run_date 10-08 == yesterday, so window was ON OR AFTER 2026-10-08) minus the 10-08 digest's 32 reference URLs. 26 refs: 23 blog, 3 video. VERIFICATION: 40/40 body quotes machine-checked with NFKD + smart-quote normalisation against fetched HTML, transcripts, the ts-rust README and the OpenAI RSS. Zero misses. Two initially failed and BOTH were resolved rather than cut: 'They say staff are now' was a regex artifact (adjacent quote pairing), and 'harder problems around security, scale, and performance' was an AGENT-SUPPLIED quote I had not fetched myself — I fetched the TechCrunch Gemini article and confirmed it verbatim. ALWAYS RE-FETCH THE PRIMARY FOR ANY QUOTE THAT ONLY AN AGENT SAW. Re-ls'd all three cited transcripts AFTER writing (present, no mid-run prune). hugo --minify exits 0; rendered page 6 h2 / 20 h3 / 91 links (minified HTML is ONE LINE — use `grep -o | wc -l`, never `grep -c`). LEAD STORY IS A THREE-PRIMARY CONVERGENCE AND THE BEST SYNTHESIS IN WEEKS: the OpenAI math dump keeps generating its own refutation. 10-06 the dump, 10-07 the withdrawal of three manuscripts, 10-08 BOTH the AGMAI statement (TechCrunch) declining to certify it AND set theorist Asaf Karagila's line-by-line demolition of the Partition Principle preprint. Karagila is the ideal source — he had publicly promised Altman a bottle of whisky if the problem were solved, and explains why he is not sending it. WHEN A LAB MAKES A SWEEPING CLAIM, WATCH THE NAMED SPECIALIST IN THAT EXACT SUBFIELD FOR 2-3 DAYS. KARAGILA DATE TRAP: karagila.org/2026/openai-pp/ has NO date anywhere in the HTML (no JSON-LD, no <time>), and the agent reported 'unknown' — the site's feed.xml gives 'Thu, 08 Oct 2026 10:25:37 +0100', which is IN WINDOW. The post says the announcement was 'yesterday', which would have mis-dated it to 10-07 and wrongly excluded it. ALWAYS CHECK A BLOG'S FEED BEFORE ACCEPTING 'UNDATED' — internal relative-time references are not a date. SECOND-BEST SYNTHESIS: NVIDIA's $1B and Anthropic's $150M were announced the SAME DAY at the SAME White House 'Science: A New Golden Age' event — neither post mentions the other, and only reading both reveals $1.15B of private money landing on federal science in one afternoon. DIFF VENDOR ANNOUNCEMENTS FOR A SHARED VENUE NAME, NOT JUST A SHARED TOPIC. THIRD: a genuine cross-medium theme — 'AI reporting success it did not earn' — linking the Stack Overflow 'silent green exit' essay, the OpenAI math withdrawals, and Theo watching Haiku 5.5 announce it would wait for a GitHub rate limit and then not schedule the wait. The live transcript observation is what made the essay concrete. HEADLINE OVERSTATEMENT CAUGHT AGAIN (3rd run running): 'OpenAI's revenue is reportedly $20 billion less than previously projected' is really a DEFINITIONAL correction, not a shortfall — CNBC's primary says $50B annualised vs the ~$68B widely reported, and the $68B included GROSS partner revenue specifically to make a like-for-like comparison with Anthropic. I reported the nuance and the 77%/107% growth figures. Markets still read it badly (NVDA -3%, ORCL -6%, CRWV -8%). AGENTS WERE CLEAN THIS RUN — the anti-fabrication paragraph naming the past HN-score invention is now 3-for-3, KEEP IT VERBATIM IN BOTH PROMPTS. Batch-1's OpenAI RSS parse matched my independent parse item-for-item (5 in-window items, same slugs and dates); batch-2's Algolia points and TechCrunch URL dates matched mine. Batch-2 correctly self-reported three partial failures instead of inventing content. TRANSCRIPTS: 12 present, only 4 never covered (grep'd all video IDs against every past digest — the other 8 were already cited on 10-03/10-04/10-05/10-06/10-08). Used 3. KEYWORD SCREEN WAS RIGHT ABOUT RANK BUT WRONG ABOUT THE FLOOR: Theo 54.4/1k, Karp 4.5/1k, Swisher 1.7/1k — yet BOTH low scorers earned slots after targeted keyword-window reads. Karp's density is low because he speaks in abstractions ('it', 'the thing') while actually discussing data sovereignty and not 'seeping your alpha'; Swisher's is inflated by a Rippling AI AD READ yet contains one real governance thread (Gibney on super-admin federal data access and model training before the midterms, explicitly hedged as 'I suspect he does, but I can't say for sure'). STRIP SPONSOR READS BEFORE TRUSTING A DENSITY SCORE, AND ALWAYS DO THE WINDOW READ ON A SUB-5/1k INTERVIEW. Dropped 2026-10-05-6f-4VBP2syc (Tom Lee, finance → market digest) for the second run running. BEST SINGLE ARTIFACT OF THE DAY: github.com/pingdotgg/ts-rust — Theo's LLM-written Rust port of tsc. The README publishes its FAILURES, which is why it beats any article about it: >$400k of GPT-5.6 Sol + GPT-6 Astra tokens wrote 1.3m lines of Rust over months and plateaued at ~84% compat; Opus 5.5 ignored all of it, started from scratch, had a working v0 in 10 hours, ~$24,047 over 2 weeks. Author's own caveats ('I've never read a line of this code', a section header literally called 'The Slop Line') are as quotable as the numbers. RAW.GITHUBUSERCONTENT REMAINS THE HIGHEST-VALUE-PER-FETCH SOURCE — second run running. OPENAI RSS HEALTHY (767,810 bytes); article pages STILL 403 to curl AND WebFetch, so the false-front influence-ops report is RSS-summary-only and I labelled it as such in the body, not just the reference. CLAUDE.DEV STILL NOT IN .feed/source.md after FOUR runs of flagging. Anthropic /news + /research absent after SIXTEEN runs and still only fetched because this cursor passes them explicitly — /news carried ALL THREE Anthropic items this run, i.e. the single most productive URL of the day is the one missing from the source file."
