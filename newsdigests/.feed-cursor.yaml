last_run_date: "2026-09-14"
last_summary_file: "content/newsdigests/2026-09-14-daily-digest.md"
notes: "Window: on-or-after 2026-09-13, deduped against the 09-13 digest's 22 URLs. 6 articles + 6 GitHub repos, 0 videos. Monday run — the story is still the Amodei pacing essay, but the reaction wave has split into three distinct camps: political (Obama/Trump via TechCrunch), skeptical-press (Equity podcast), and a technical rebuttal (Bryan Cantrill). BIGGEST FINDING THIS RUN — the two configured hnrss feeds (q=AI, q=LLM) match on TITLE TEXT ONLY, so they silently miss major HN front-page AI stories whose titles contain neither string. Cantrill's 'The contagion of fear' (232 pts, the single best piece of the day) and 'Ask HN: What are you working on?' (219 pts, 443 comments) were both INVISIBLE to my raw parse and to batch 1; only batch 2 surfaced them. Fix: query the Algolia front-page API (hn.algolia.com/api/v1/search?tags=front_page) alongside hnrss, not instead of it. Agent performance was inverted from 09-13: batch 1 STALLED at 600s but its partial YAML was accurate and matched my parse exactly; batch 2 COMPLETED and was the only source for three real stories. Verified batch 2 claim-by-claim via Algolia — bcantrill (232pts), Sacks (311pts, objectID 49685991), Ask HN (219pts) are all REAL, contradicting the prior-run assumption that agent-only items are fabrications. But batch 2's Ask HN *statistics* ('33% AI projects vs 17% in 2024', '6,000 submissions') are uncorroborated and were NOT published — the item was dropped rather than risk inventing numbers. Batch 2 also reported Addy Osmani as a 300s timeout; my own curl read the feed fine (newest 08-22), so that failure is a MISLABEL and consecutive_failures stays 0. GitHub Trending: both my parse and batch 2 returned the identical 20 repos in identical order — strongest cross-validation yet; note my first regex returned 0 because <a> now carries data-hydro-click attrs before href, so match <a\\b[^>]*?href=. Rundown content verified verbatim against the source including the Hassabis/Nadella endorsements the agent asserted. Trump's 'negative forces' quote and Altman's 'independent evaluators with employee-like access' pledge each appear in TWO independent sources (Rundown + TechCrunch/Obama) — both solid. Interconnects piece is really 09-11 published / 09-13 updated, surfaced on HN today; included with real dates shown rather than passed off as new. CORRECTED BEFORE PUBLISH: I initially wrote an invented HN item id (49688109) for the Sacks link; real objectID is 49685991 — never hand-write an HN id, always read objectID from Algolia."
