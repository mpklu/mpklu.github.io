notes: "WEDNESDAY RUN, window on-or-after 2026-09-29. 31 blog refs + 6 video refs = 37, the biggest digest on record. RACE RULE EARNED ITS KEEP, BIGGEST WIN YET: at 08:41 the yt-fetch log mtime equalled `date` to the second and PID 13242 (claude -p /blog_yt-fetch) was alive with ZERO new transcripts on disk. Had I concluded 'no new videos' I would have lost FIVE transcripts including the two best items of the day. yt-fetch ran 08:03->10:50 (2h47m, abnormally long) and dripped files out in four waves: Theo+Dwarkesh ~10:44, the two America.gov copies ~10:47, then Altman/Amodei/Karp ~10:50. ALWAYS check the log mtime AND ps before concluding. LEAD STORY: the WHITE HOUSE ACCORD on safe AI development - and it came ONLY from transcripts, zero blog sources had it. Two INDEPENDENT transcript confirmations: Musk from the America.gov stage ('grading each other's homework') and Zuckerberg on USA TODAY, who NAMED it ('the White House Accord') and supplied the detail Musk did not - internal risk review + external auditors + BOARDS OF DIRECTORS independently reviewing auditor reports. Pichai framed it as importing financial-controls governance. I checked whitehouse.gov/briefing-room myself: NOT published (only 'Signers of the Declaration of Independence' matched) and Algolia 'joint declaration AI safety' returned zero hits - so I wrote it as attributed statements, not as a public document, and said so inline. #2 STORY: Altman on CNBC directly rebuts Huang's 'engineering problem' framing from yesterday's digest - 'I don't think it's a full solution... we have a science problem in front of us.' This ANSWERS the TechCrunch 'why is OpenAI absent from OASP' piece from the same day; blog + video synthesis, both cited. TRANSCRIPT LOSS: 2026-09-29-388P7IFSpwE.txt (RSBN, the copy I actually read in full) was DELETED by yt-fetch before I committed - deduped against the Forbes copy Gf-KssYwepc. I re-verified the Forbes copy carries every quote I used (joint declaration/Open Shell/SI factories/steak knife/false choices/Skylab/three times all present) and swapped the primary citation to Forbes, keeping RSBN as ref #36. BUT 'Podesta' is 0 in the Forbes copy, so I DROPPED the convener attribution rather than carry a name I could no longer re-check. LESSON: read-then-cite is not safe when yt-fetch is still running; it can prune the file under you. AGENT ERRORS CAUGHT (4): (1) batch 2 declared Stack Overflow's two 09-28 posts 'not found in current blog' - FALSE, my own /feed/ parse had both at real URLs and I fetched both at HTTP 200; it ALSO missed the 09-30 Developer Survey post. Third consecutive run where an agent mislabels a live source as dead. (2) batch 2 stamped date:2026-09-29 on everything it found yesterday regardless of actual publication - Anthropic prospectus (/2026/09/28/), Peak XV (/09/28/), EFF DraftKings (really 09-24), the privacy PDF (really 09-16). Trust the URL path and the article meta, never the agent's date field. (3) batch 1 PADDED the OpenAI RSS blurbs with invented sentences - the real RSS description for GPT-6.1 Sol is ONE sentence, the agent returned four, adding 'available now via the OpenAI API, optimized for users needing high-capability reasoning' which appears nowhere. Used only the verbatim RSS text. (4) batch 1 mangled the Google America.gov URL (dropped 'google-' from america-gov-google-public-sector); my parse had it right, and the real page title is 'Google Gemini powers new America.gov portal'. BYLINE DISCIPLINE HELD: I nearly shipped 'Mark J. Nelson' for kmjn.org from inference - stopped and verified via the page title before committing. Rundown dc:creator fields confirmed all four names. Only wrote bylines I read: Dayen (Prospect), Nishar (EFF), Cabral+Jassem (The National), Neely (AppleInsider), Malik (TechCrunch Sol), Fasano et al (Anthropic). Left every other TechCrunch item bylineless rather than guess. TRIPLE-CONFIRMED the Sol pricing: OpenAI RSS ('one-fifth of Astra'), the Rundown ($2/$10 per million) and Theo's independent testing ($2 in/$10 out/$0.10 cache) all agree - and Theo supplies the insight none of the blogs had, that the $0.10 cache read breaks OpenAI's standing 10%-of-input convention and is what actually moves agent economics. DEDUPE DROPPED: Anthropic IPO prospectus (ref #2 yesterday; Reuters 134p is the same story via a second outlet, and the Rundown 09-30 re-ran it as its #2 - dropped all three), all remaining NVIDIA OASP coverage, arXiv 2110.01834 'Thinking fast and slow' resurfaced on Algolia for the THIRD consecutive day (177p) - dropped again, the Civilian, Cal Newport, World Labs/AMD, ssp.sh, Glyph, MicroLLM Lab, CNBC watchdog chip, and Stack Overflow 'Your phone is AI's newest hardware' (ref #24 yesterday). The 419p 'Privacy Analysis of Web and Mobile Conversational AI Agents' PDF is the SAME document I dropped yesterday at 171p under a different title - filename says 20260916, 14 days old, dropped again. Algolia false positives discarded: NASA SR-71, 'Sustainable energy without the hot air (2008)', RSS Feeds for Last.fm. OFF-TOPIC TRANSCRIPT EXCLUDED: Dwarkesh 2026-09-29-xsYoSwrcNOY 'How Korea Went from Civil War to Near World War' - 229 words, 57s, keyword screen returned EXACTLY 0 AI hits. Genuine off-topic (Sarah Paine is Dwarkesh's recurring military-history guest), not a broken regex. All 6 transcripts clean, 0 ASS escapes, all under 10k words so read in full. hnrss q=AI/q=LLM NOT probed this run - Algolia front_page + 3 search_by_date queries (AI/LLM/OpenAI) were the sole HN source and the OpenAI query is what surfaced the Altman/Dots/Pro-tier cluster; add it permanently. A stray 2026-09-29-kqIudzftndA.en-orig.srt was left mid-run and cleaned up by yt-fetch itself by 10:50 (en-orig fallback in use, so the translated-subs 429 path is still live)."
