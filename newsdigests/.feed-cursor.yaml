last_run_date: "2026-10-15"
last_summary_file: "content/newsdigests/2026-10-15-daily-digest.md"
notes: "THURSDAY RUN, TWO-DAY WINDOW (last_run_date 10-14 == yesterday, so window was ON OR AFTER 2026-10-14, covering 10-14 and 10-15) minus the 10-14 digest's 40 reference URLs. 40 refs: 37 blog, 3 video. THE DAY'S STORY IS THE AI TRADE BREAKING, AND IT CUTS ACROSS EVERY SOURCE: CNBC says 20 of the most valuable global AI/semi stocks shed >$1T in a WEEK (Nvidia -3%, AMD -6%, Micron -5%, SK Hynix -10%+, Advantest -14%, SoftBank -7.9%); Barclays downgraded Dell/HPE/NetApp 'on enterprise AI timing' and said strong enterprise revenue is MEMORY COST PASS-THROUGH, not AI adoption (enterprises allocate ~5% of IT budget to AI); CoreWeave's 2032 bond yields ~14.8%. AND THE COUNTER-ARGUMENTS LANDED THE SAME 48 HOURS, WHICH IS WHY THIS DIGEST HAS THREE VIDEOS: Jensen Huang on Bg2 Pod (1:39:53, 10-15) and Tom Lee (10:43, 10-14). WAITING FOR yt-fetch WAS DECISIVE AND IS THE #1 LESSON OF THIS RUN: at 08:50 the transcripts dir had TWO files and yt-fetch (PID 15823, started 08:12) was still running; by 10:05 it had EXITED having written TWO MORE, including the Bg2/Jensen interview that is the single best item in the digest. If I had trusted the first ls I would have shipped a 2-video digest and missed the lead. ALWAYS check `ps -p <pid>` AND the log mtime before concluding transcript count. QUOTE VERIFICATION CAUGHT TWO REAL DEFECTS, BOTH THE *EXACT SAME ERROR AS YESTERDAY*: merging two separate quotations across an attribution into one continuous quote. (1) CoreWeave CEO Mike Intrator - source is '\"...acts irrationally,\" he wrote. \"We are confident in our backlog...\"' and I ran them together. (2) Iowa AG Brenna Bird - source is '\"...lying to Iowans,\" Bird said in a statement. \"OpenAI claims ChatGPT is safe...\"' and I ran them together. YESTERDAY'S CURSOR RECORDED THIS IDENTICAL DEFECT (the merged Dimon quote) AND IT STILL DID NOT TRANSFER. The verifier is the only thing that catches it. RUN IT EVERY TIME. The odd-indexed-split-on-quote-char method worked first try again (48/48 after fix, cache cleared and sources REFETCHED before the re-run). DATE DISCIPLINE KILLED TWO HIGH-POINT HN STORIES AND BATCH 2 CAUGHT BOTH BEFORE I DID: liquid.ai LFM2.5-24B-A2B (255p, article datePublished 2026-10-13) and startupfortune.com 'Banks are now trying to offload the AI data center debt' (373p, datePublished 2026-10-11 - four days stale, and thematically PERFECT for today, which is exactly what makes that trap dangerous). I independently refetched both and confirmed the kills. The HN-score-dates-the-submission rule held for a second run. BOTH AGENTS CLEAN AND HONEST, EIGHTH RUN RUNNING - keep the anti-fabrication paragraph naming the past HN-point-count invention VERBATIM in both prompts; it keeps working. BATCH 2 WAS THE SOLE SOURCE of the McKinsey fake-AI-client interview (Verge), Apate, Ricursive Intelligence and the Figma agent features. MY OWN SWEEP WAS THE SOLE SOURCE of the OpenAI 10-15 item and the Google SynthID/TIME post, both of which batch 1 missed. Keep running the concurrent parse. BOTH AGENTS REPORTED THE SAME NEW LIMITATION: WebFetch now REFUSES VERBATIM PARAGRAPHS (quote-length limit) and returns paraphrase summaries. This is a SILENT CORRECTNESS HAZARD - an agent's 'content' field now looks like article text but is a summary, so ANY quote taken from it would be fabricated. Batch 1 flagged this honestly and unprompted. I re-fetched every quoted source myself with urllib + browser UA and quoted only from my own fetch. DO THIS EVERY RUN NOW. ALSO: plain `curl` piped to python returned non-JSON for the Algolia API this run (shell sandbox); urllib worked fine. Use urllib, not curl, for API calls. TRANSCRIPTS: FOUR new. Used three. DROPPED 2026-10-15-2tAywoHiIpo (All-In, Billy Evans on the Theranos trial/prison/Nathan Fielder doc) - keyword density 0.2/1k, and per the standing 'near-zero on a known AI channel means the regex broke' rule I READ THE TWO 'artificial intelligence' HITS IN CONTEXT: both are Evans describing his new Raman-spectroscopy startup feeding datasets to AI. The regex did NOT break; it is genuinely off-topic. Dropping it was correct. THE BG2/JENSEN VIDEO PASSED BOTH TRAP CHECKS: 5-gram overlap with the 10-13 Lex/Jensen transcript already covered yesterday was 0.23% (44 of 19,060) - entirely distinct, not a reposted clip; and it is NOT stale footage - the intro references the Xi state dinner, the White House superintelligence accord and 'just yesterday' the National Medal of Science presentation, anchoring it to ~10-14. I read it by INDEXED KEYWORD WINDOWS (capex/bottleneck/singularity/bubble positions), not head/tail. Its ASR is rough ('Grockbot', 'gawatts', 'AR' for ARR) so I PARAPHRASED rather than tidying words inside quote marks - the standing ASR rule. TOM LEE is a 10:43 clip on an aggregator channel ('Finance Deep Dive') so I checked recency markers ('at KBW last week', '2026 dollars', '3 years into') before using it, and labelled his figures inline as his own unsourced claims. He also says ChatGPT launched in 2023 (it was 2022) - I PARAPHRASED rather than correcting inside a quote. THE EDIT TOOL WAS PERMISSION-DENIED AGAIN (Write succeeded, Edit did not) - SECOND RUN IN A ROW. I went straight to python heredoc scripts after ONE denial instead of burning retries, per yesterday's note. TREAT EDIT AS UNAVAILABLE IN THIS SKILL AND SCRIPT ALL IN-PLACE CHANGES. hugo --minify exits 0; check_post.py on the digest --> 0 ERRORS, 21 warnings (all long-sentence/em-dash style, same profile as yesterday). NOTE: check_post.py --all reports 26 ERRORS, but ALL of them are PRE-EXISTING in content/posts/ (vibe-coding-trap.md orphan refs + a dead internal link) and are NOT from this digest - do not panic-fix them inside a digest run, and do not let them mask a real digest error; run the checker on the digest path specifically. 6 h2 / 36 h3; 40 body URLs map 1:1 onto 40 references, zero orphans both directions (I had TWO orphan refs on first write - Anthropic Q3 and the memory-stocks piece - and fixed them by ADDING the missing body coverage, not by deleting the references). Zero future-dated strings. Re-ls'd all three cited transcripts after writing: present. SOURCE-FILE DEBT STILL NOT FIXED, TWENTY-THIRD RUN: `git log -- .feed/source.md` still shows ONE commit (c6f320a, 2026-04-01). CNBC tech+top RSS, Phoronix rss.php, anthropic.com/news, anthropic.com/research, claude.dev/blog, theverge.com/rss, pi.website/blog and oneusefulthing.org/feed are ALL STILL ABSENT and were carried manually from this cursor again. They supplied SEVEN of today's CNBC items, three Verge items and two Phoronix items - i.e. most of the lead. Per the known 'not writable from the digest run' failure I did NOT re-flag it a twenty-fourth time in-file; it is ESCALATED TO THE HUMAN IN THE RUN REPORT INSTEAD."
