last_summary_file: "content/newsdigests/2026-10-10-daily-digest.md"
notes: "SATURDAY RUN, ONE-DAY WINDOW (last_run_date 10-09 == yesterday, so window was ON OR AFTER 2026-10-09) minus the 10-09 digest's 26 reference URLs; comm -12 overlap with yesterday was EMPTY. 16 refs: 14 blog, 2 video. VERIFICATION: 45 body quotes/figures machine-checked with NFKD + smart-quote normalisation against fetched HTML and transcripts. THREE initially MISSED and ALL THREE WERE RESOLVED, one of them a REAL ERROR I HAD ALREADY WRITTEN: (a) 'Most are forms of persistence, in which...' missed only because Anthropic italicises 'persistence', leaving 'persistence ,' with a space before the comma after tag-stripping — quote was correct. (b)+(c) '$7.5 billion' and 'September 15 release' were AGENT-ONLY figures I had not fetched; re-fetching the TechCrunch Jev article confirmed both AND exposed my own error. BIGGEST LESSON OF THE RUN: I wrote that TypeSafe's own post 'states only that it raised $$$' and that the $870M/$7.5B figures 'come from TechCrunch, not from TypeSafe'. FALSE. The figures ARE on typesafe.ai/blog/series-ai — in a footnote AFTER the sign-off ('$870 million at a $7.5B valuation, with Martin Casado joining the board'). My first read stopped at the jokey body copy. SCAN THE WHOLE PAGE INCLUDING POST-SIGNOFF FOOTNOTES BEFORE CLAIMING A COMPANY DIDN'T DISCLOSE SOMETHING — a negative claim about a source needs a full-page grep, not a skim. Fixed before publishing. LEAD STORY IS A THREE-PRIMARY CONVERGENCE WITH A DISCLOSURE-GAP TWIST: Anthropic's 10-09 'Investigating unintended model actions' (/research) + TechCrunch's analysis + TechCrunch's Philadelphia piece. Anthropic ANONYMISES every org in the report ('at their request'); the Philadelphia PD NAMED ITSELF publicly a day BEFORE the report dropped, and supplied the damning timeline the report omits (submitted 7/18 11:27pm, detected 9/28, notified 10/7, PPD: 'The two-month delay... is unacceptable'). WHEN A LAB PUBLISHES AN ANONYMISED INCIDENT REPORT, CHECK WHETHER THE VICTIM ORG HAS ALREADY SELF-IDENTIFIED — the subject is not bound by the lab's NDA and is usually angrier. SECOND-BEST SYNTHESIS, AND A GENUINE SAME-DAY COLLISION: All-In's Freeberg called OpenAI's 700-paper dump 'probably the biggest day of discovery in human history' and cited LEAN VERIFICATION as grounds for confidence — while Thomas Hales, guest-posting on Terence Tao's blog THE SAME DAY, published the precise rebuttal: the 'Summer of Soundness Bugs' (several Lean kernel bugs in Jul/Aug 2026, one yielding an illicit disproof of Collatz, another a short illicit proof of Kepler), plus the rule 'Lean proofs should never be believed until they have been checked by the kernel' AND a human audit of STATEMENT FIDELITY. Cross-checking across Lean's ~25 kernels is NOT sufficient (the Collatz bug passed a Nanoda cross-check that had its own unrelated bug). This continues the multi-day OpenAI-math thread (10-06 dump, 10-07 withdrawals, 10-08 AGMAI + Karagila, 10-09 Hales). KEEP WATCHING THE NAMED SPECIALISTS. THIRD: cross-medium theme 'our instinct to treat machines as persons is now a business input' — TechCrunch/Turkle (~70% of people are polite to AI; 'we are wired to care for it in return') against All-In's NYT-sourced segment on Anthropic convening ~20 religious leaders under NDA on whether Claude is conscious. NYT IS UNFETCHABLE: WebSearch REJECTS allowed_domains=['nytimes.com'] outright ('not accessible to our user agent') and there is no direct fetch path. Only aiweekly.co-style secondary summaries surfaced. I therefore attributed the thread to the All-In transcript I actually hold, and CUT the 'Pope Leo' name (only secondary aggregators gave it) down to 'the Pope's first encyclical', which IS in the transcript. DON'T LAUNDER AN AGGREGATOR DETAIL INTO A PRIMARY. AGENTS WERE CLEAN, 4-FOR-4 — keep the anti-fabrication paragraph naming the past HN-score invention VERBATIM in both prompts. Better than clean: batch-2 CORRECTED TWO OF MY OWN PREMISES. (1) My Algolia numericFilters epoch 1760054400 is 2025-10-10, NOT 2026 — it fixed it to 1791504000. FIX THE EPOCH IN THE PROMPT. (2) My prompt asserted 'cursor.com/blog has NO dates'; the agent checked and reported the HTML DOES carry dates now ('Sep 23, 2026'). The old cursor note is STALE — Cursor's blog is dated again, so 0-in-window there is a real zero, not a date-parsing blind spot. Every GitHub Trending star count the agent returned matched my own parse EXACTLY (morluto/rea 25,784 stars today — verified, real, and the repo is ~61k total and climbing; I rounded it in the body because it moved 60 stars during the run). ROUND A LIVE COUNTER OR IT IS STALE ON ARRIVAL. MY INDEPENDENT PARSE matched batch-1 item-for-item on OpenAI (2 in-window, same slugs), Google (0 across all four feeds) and DeepMind (0), and matched batch-2 on TechCrunch (9 in-window, same URLs). DATE-DISCIPLINE WINS: TechCrunch 'can't reliably control' has pubDate 2026-10-10 UTC but URL path /2026/10/09/ — trusted the URL path, correct. Lobsters listed 'Whistle' with feed pubDate 10-09 but the ARTICLE is dated 10-02 — correctly excluded. Zero future-dated items anywhere this run. TRANSCRIPTS: 13 present, 4 never covered. Used 2 (All-In 16.9k words via KEYWORD-WINDOW reads, never head/tail; Theo 9.9k). Dropped BOTH Tom Lee clips (Fundstrat/Finance Deep Dive) as finance -> market digest; 6f-4VBP2syc now dropped THREE runs running — consider a yt-fetch filter. Re-ls'd both cited transcripts AFTER writing: present, no mid-run prune. THEO IS A LEGITIMATE FOLLOW-UP, NOT A DUPLICATE: yesterday cited the ts-rust README; today the thing SHIPPED to npm with benchmarks (12.5x faster than TS v6, ~2x faster than Microsoft's TSGO) and a competitor (Bun's `bun check`, which Theo concedes is faster than his). A SHIPPING EVENT IS NEW NEWS EVEN WHEN THE REPO WAS COVERED. hugo --minify exits 0 (473 pages); rendered page 6 h2 / 13 h3 / 84 links, matching the source exactly. NOTE FOR FUTURE RUNS: counting '[blog]'/'[video]' in the MINIFIED html gives 6x the real number — the same text appears in meta tags, JSON-LD (as \\u0026rsquo;), the TTS payload and the body. COUNT h2/h3 TO PROVE THE BODY RENDERED ONCE, NOT ARBITRARY PHRASES. SOURCE-FILE DEBT UNCHANGED AND NOW COSTING THE LEAD STORY: anthropic.com/news + /research are absent from .feed/source.md after SEVENTEEN runs and are only fetched because this cursor passes them explicitly — /research carried TODAY'S LEAD. claude.dev missing after FIVE runs. Only anthropic.com/engineering (a stale archive, newest 2026-04-23) is actually in the file."
