notes: "TWO-DAY WINDOW: no digest ran on 09-18, so the cursor still read last_run_date 2026-09-17 and the window was on-or-after 2026-09-17, deduped against the 09-17 digest's 34 URLs and all prior GitHub repo slugs. Result: 41 items (36 blog/repo + 5 videos) from a 3-day span. NO yt-fetch RACE this run — it finished at 08:17 and pgrep was clean at 08:24, the first quiet handoff in three days; still verified by diffing all 25 transcript filenames against every prior digest's youtube.com/watch URLs rather than using ls|tail (the 09-17 lesson held). 10 new transcripts, of which only 5 were AI/coding: Noam Brown/Dwarkesh, LeCun/SciencesPo, Karp/CNBC, Dina Powell/All-In, Theo t3.gg. The other 5 were correctly dropped as off-topic — Bill Gurley's 'Searching for Feynman' is about COVID origins and he says on tape 'I'm not going to talk about AI' (only 5 AI hits in 6,696 words; the keyword-count screen caught this in one call and is worth keeping), plus Isaacman/NASA, Nick Shirley, America's Next 250, Tom Lee/markets. convert_srt \\h escape count was 0 across all 10 files. AGENT PERFORMANCE — BEST RUN YET, BOTH BATCHES: batch 1 returned 14 posts that matched my independent curl parse EXACTLY, item for item, with an empty failures list and a correct zero_in_window list (Anthropic, Cursor, DeepMind, Google Devs, Google Innov/AI, Addy Osmani) — the first run where an agent did NOT mislabel a healthy-but-empty source as a failure. Batch 2 was right about hnrss (502 after 3 retries) and TechCrunch's 20, but under-reported NVIDIA (missed the developer-blog AIPerf post my parse found) and returned empty content for every TechCrunch item, so all TC bodies came from my own curl. LESSON RE-CONFIRMED: run the independent curl parse concurrently from the start — it was the sole source for NVIDIA-dev, and the sole content source for ~15 articles. hnrss BOTH feeds returned exactly 552 bytes, three retries each, parsing to zero items — the len(body)<1000 rule fired correctly and Algolia front_page + search_by_date(points>100) was again the ONLY HN path, supplying the day's top story (Microsoft 'largest theft of labor' 897p) plus Claude Code AGENTS.md (675p), Bend (599p), hacktron OpenAI hack (478p), CNN military hallucination (465p), ZCode (310p+260p). NEW GOTCHA: the Algolia 'url' field I printed was truncated by MY OWN 90-char display slice, and I briefly mistook a 404 for a dead TechCrunch link — the real slug was longer ('...-new-unredacted-filings-reveal'). Recover it via Algolia query search, not by guessing; do not blame the source. UNREADABLE (JS-only shells, omitted rather than summarized from titles per the standing rule): qwen.ai/blog returned the literal 5-byte string 'Qwen' for the Qwen 3.8 Omni Flash launch (334p), and spectrum.ieee.org returned nav-chrome only for the OpenAI Jalapeño chip story (138p) — both dropped from the body. stackoverflow.blog/2026/09/17/the-ai-magic-words is a PODCAST episode page with no article body (Tim O'Reilly guest), also dropped. science.org still 403s (the 'AI chatbots changing minds' item). OpenAI article pages still Cloudflare-403 so all three OpenAI items are RSS-description-only with that limitation stated inline in the digest body. GitHub Trending: the repo-name regex needed TWO rewrites — the first returned zero articles entirely (silent failure, not an error), the second worked by splitting on <article> and filtering candidates starting with sponsors/, login, orgs/, topics/. 15 repos, 11 already covered in prior digests, 4 genuinely new AI/agent repos kept; OpenStock and hister dropped as non-AI. Reported 'stars today' only, never absolute counts. VERIFICATION: no agent claim was used without a source fetch behind it. Cross-source synthesis worth preserving — the DeepMind Institute essay by Shah/Dragan argues reasoning transparency loss 'is not inevitable' while Noam Brown says on tape that chain-of-thought monitorability is already degrading; these were linked explicitly in the digest. Dina Powell's own numbers are internally inconsistent (40,000 applied / 250 graduated, but Chamath says 'you picked 400' and she agrees; also 3.5B vs 3.6B daily users in the same interview) — used only the figures she stated directly and skipped the disputed settlement dollar amount Calacanis and she argued over."
