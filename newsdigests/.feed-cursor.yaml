notes: "WEDNESDAY RUN, ONE-DAY WINDOW (last_run_date 10-13 == yesterday, so window was ON OR AFTER 2026-10-13) minus the 10-13 digest's 29 reference URLs. 40 refs: 39 blog, 1 video. HUGE NEWS DAY — two lead stories. #1 for the AI audience: GOOGLE SHIPPED GEMINI 4 ARGON (10-13T16:00Z) across five surfaces at once plus a safety report, a robotics post and app/developer posts. #1 for the coding audience: 'Redesigning source control at Anthropic' — Anthropic replaced git with an in-house VCS (Scion) in five months because merges went from ~2,500/day in May to >30,000/day in September. CRITICAL CORRECTION TO THIS CURSOR'S OWN STANDING NOTE: anthropic.com/engineering IS NO LONGER A STALE ARCHIVE. Every prior cursor said 'stale archive, newest 2026-04-23, leave it, it costs one fetch.' It published on 10-13 and it was the single best engineering post of the day (801p on HN). MY OWN ALGOLIA SWEEP FOUND IT, NOT THE AGENTS' LISTING CRAWL — and batch 2, handed the URL, actually advised me to RE-CHECK ITS DATE because the project notes called the host stale. A stale note in a prompt is a false premise that propagates; treat /engineering as live from now on. VERIFICATION: 40/40 body quotes machine-checked (NFKD + smart-quote + punctuation + ellipsis-fragment splitting) against freshly refetched HTML and the transcript — AFTER FIXING FIVE REAL DEFECTS I INTRODUCED, THREE OF THEM INSIDE QUOTATION MARKS. (1) Dropped the word 'that' from Anthropic's 'Fetched naively, THAT would be over 600 PB'. (2) Changed Anthropic's 'nearly all of our clients WERE agents' to 'are agents' — tense altered inside quotes. (3) Merged TWO separate Dimon quotes (split by 'Dimon said') into one continuous quotation. (4) Put my own rhetorical phrase 'can an agent touch my account?' in quote marks as if sourced. (5) REPEATED YESTERDAY'S EXACT ASR SIN: quoted Jensen as 'it's just not enough talent there' when the transcript says 'because THERE'S just not enough talent there' — fixed by paraphrasing, not by tidying. THE LESSON FROM 10-13 DID NOT TRANSFER ON ITS OWN; the verifier is what caught it, so RUN IT EVERY TIME and use the odd-indexed-split method (it worked first try today, unlike yesterday's two broken regexes). DATE DISCIPLINE KILLED FOUR HIGH-POINT STORIES, all the same trap — a big HN score dates the SUBMISSION, not the article: Ars Technica 'AI coding agents generate more code, but not more software' (362p, datePublished 2026-10-09), arXiv 2610.13928 'AI Models Can Provably Hide Arbitrary Capabilities' (275p, published 10-09 via export API), Apple's distributed-GPU-cloud research (246p, 10-12), and Lobsters' 'RAG with a small language model in the browser' (pubDate 10-13 but page says 10-12T22:57-04:00 — my parse and batch 2 agreed independently). BOTH AGENTS CLEAN AND HONEST, 3-FOR-3, SEVENTH RUN RUNNING; keep the anti-fabrication paragraph naming the past HN-score invention VERBATIM in both prompts. BATCH 2 CAUGHT A BUG IN MY OWN PROMPT: I gave it unix ts 1823040000 for 2026-10-12, which is actually 2027-10-09, so its first Algolia call returned zero; it diagnosed it, recomputed 1791763200 and re-ran rather than reporting an empty result. Verify the epoch before pasting it. BATCH 2 WAS THE SOLE SOURCE OF THE PHYSICAL INTELLIGENCE API BETA (pi.website/blog/api-beta, 10-13) — a robot-foundation-model API launch that is in NO source list and that neither my parse nor batch 1 could have reached. BATCH 1 WAS THE SOLE SOURCE OF THE ANTHROPIC SINGAPORE OFFICE + MDDI MOU (10-14, anthropic.com/news) — again a manually-carried URL my own sweep has no path to. TRANSCRIPTS: only ONE new (2026-10-13-FGCP2F_7rQk, Lex Fridman + Jensen Huang, 1:30:18). DbWL6Zs2j_g was already covered in the 10-13 digest; yZR8QW4qQmM stays dropped. THE JENSEN VIDEO IS THE 'FRESH UPLOAD HIDES OLD FOOTAGE' TRAP AGAIN, THIRD TIME IN THREE WEEKS: published 10-13 but filmed around Computex, which per JETRO ran JUNE 2-5, 2026 — roughly four months stale. Caught it from a single word ('Computex'