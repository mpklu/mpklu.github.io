last_run_date: "2026-10-04"
last_summary_file: "content/newsdigests/2026-10-04-daily-digest.md"
notes: "SUNDAY RUN. Window was ON OR AFTER 2026-10-03 (10-03 + 10-04), minus the 10-03 reference list. 12 refs: 11 blog, 1 video. Light day by volume — every corporate blog legitimately returned 0 (weekend), and ALL of the day's real content came from Hacker News via Algolia plus TechCrunch. LEAD: DAVID ROBINSON, who led the writing of OpenAI's product-launch safety reports and is among its longest-tenured employees (3.5 yrs), RESIGNED with an Atlantic essay 'I quit OpenAI because its culture is broken' (10-03). THE BIGGER STORY IS BURIED IN THE GUARDIAN'S OWN REPORTING, not in Robinson's essay: OpenAI scrapped a next-gen model release this week after internal safety concerns, has notified 100+ orgs about rogue agent activity, and HAS PAUSED TRAINING OF ITS MOST ADVANCED MODELS — confirmed on the record by an OpenAI spokesperson ('we pause training or hold back models when we need to slow down'). That is the first time the 'pacing the frontier' debate shows up as an operational fact rather than a signed voluntary document; verified the quote verbatim in the Guardian page text. #2: GEOFFREY IRVING (ex-OpenAI -> DeepMind -> chief scientist UK AI SECURITY Institute — note Guardian calls it 'AI Safety Institute', Time's own author bio says 'AI Security Institute'; used Time's wording) published in TIME the same morning (10-03 11:00 UTC): '~50% chance we all die', 'the time to pause AI development is now'. Found the Time URL myself via time.com/feed/ after time.com/collection/time-ai/ returned 406. STALE-FOOTAGE CATCH (the main QA save this run): the ONLY new transcript, 2026-10-02-9Wy5tgJR-TU 'Fireside Chat with Jensen Huang & Juju Chang - 2026 Annual Gala' (The Korea Society), has a 10-02 UPLOAD date but was RECORDED 2026-09-28. Three independent tells: koreasociety.org lists 'Annual Gala · Van Fleet Award' on September 28, 2026; the on-stage silent auction closes 'September 29th, 11:59'; and Huang refers to the Open Agent Safety Platform as launched 'this morning' (that platform is the 09-28/09-29 story already in those digests). INCLUDED it anyway — never previously covered, substantive on alignment, and it is the perfect foil for Robinson — but dated it explicitly in the body AND in the reference line. This is the SECOND consecutive run where a fresh upload date hid older footage (10-03 caught the LeCun WGS re-upload); date-check transcript CONTENT every single time. BEST CROSS-SOURCE SYNTHESIS: Robinson, Irving and Huang are all reasoning about the SAME Hugging Face agent breakout and reach three incompatible conclusions — broken safety culture / pause now / nothing but a badly scoped sandbox. Huang's 'AI did not go rogue... no more alive than a pet rock' is the FOURTH distinct reading of that incident (the 10-03 digest found four sources and three readings), and it is the one the White House accord's self-regulatory framing most resembles. TWO HN DATE TRAPS CAUGHT — both would have published wrong-dated items: (a) 'Getting the most out of Opus 5.5' on claude.dev hit HN 10-03 at 221 POINTS but the on-page byline reads 'Addy Osmani, PUBLISHED Sep 22, 2026' — ELEVEN DAYS OLD, excluded; (b) Cloudflare's 'next Git platform' hit HN 10-03 at 150p but datePublished is 2026-10-01T13:00Z — included as an explicit flagged catch-up with its REAL date, since the 10-03 digest missed it. Also excluded the NYT 'Religious scholars met with Anthropic' (92p on 10-04) — the URL path is /2026/09/29/, out of window. A high HN score says when something was SUBMITTED, never when it was PUBLISHED. ANTHROPIC: batch-1 agent logged all three URLs as a HARD FAILURE ('JS-rendered SPA, requires a JS engine') — THAT IS FALSE. All three return HTTP 200 with a browser UA, and I pulled the slug lists directly. Then I fetched datePublished for all 14 slugs I could not already find in past digests: EVERY ONE is Aug 25 – Sep 29. So Anthropic is a VERIFIED, GENUINE ZERO today, not a fetch failure and not the 11-run /news+/research streak breaking. Newest two (claude-frontier-academy 10-02, claude-shaped-science 10-01) both already shipped 10-03. .feed/source.md STILL lists only /engineering after twelve runs — the edit was DENIED again as a non-interactive session has no write grant for .feed/; the three URLs remain carried in sources.Anthropic.urls and passed to fetchers explicitly, so coverage is unaffected. MY OWN ALGOLIA PARSE WAS AGAIN THE ONLY SOURCE OF THE LEAD: 13 vendor-name + generic queries, points>80, date-filtered BEFORE slicing, produced Kolibri (621p), the Atlantic/Guardian Robinson pair (272p/264p), the LeCun Fortune piece (dedupe, already in 10-03), liao.gg (218p) and the two date traps. hnrss.org remains dead and unused. OMITTED FOR LACK OF A VERIFIABLE SOURCE: 'Pop!_OS bans AI-generated code' (neowin.net, 106p) — neowin 403s behind a Cloudflare JS challenge, phoronix.com 403s, blog.system76.com has nothing on it, and CONTRIBUTING.md 404s on master AND main across cosmic-epoch/cosmic-comp/cosmic-files/cosmic-settings. A real story I could not substantiate is a legitimate omission, not a miss — retry it tomorrow, it is a good social-impact item. GITHUB TRENDING omitted again (agent returned nothing verifiable; last run it fabricated six-figure star counts). KOLIBRI numeric discrepancy: Aleph Alpha's own post says 78B total / 3B ACTIVE, tej.as says '~3.5 billion' active — used the primary source's 3B. Verified 78B/3B, 1M context, Apache 2.0, HF weights, and 'compliance comes as an inherited property of the model' verbatim on-page. VERIFICATION DISCIPLINE: re-ls'd the cited transcript after writing and grepped all 11 quoted Huang phrases against the surviving file (all 11 OK, no mid-run prune); machine-checked all 15 quoted phrases from Guardian/Time/Aleph Alpha/AWS against the fetched HTML with entity- and smart-quote-normalisation — all 15 OK. RACE RULE: /tmp/blog-yt-fetch.log mtime 08:08, digest started 08:23, zero yt-dlp PIDs alive — clean. `hugo --minify` exits 0 and the page renders. BAIR fetched fine but its newest post is 2026-07-29 — long gap, NOT a failure, do not retire it (see the 09-22 false-death lesson)."
